name: Flux | Event summary

on:
  repository_dispatch:

permissions:
  contents: read

jobs:
  summary:
    if: ${{ startsWith(github.event.action, 'Kustomization/') || startsWith(github.event.action, 'HelmRelease/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize the received Flux event
        env:
          FLUX_EVENT_TYPE: ${{ github.event.action }}
          FLUX_EVENT: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          {
            printf '## Flux event observation\n\n'
            printf 'Event type: `%s`\n\n' "$(printf '%s' "$FLUX_EVENT_TYPE" | jq -Rs '.[0:200]')"
            printf 'Severity: `%s`\n\n' "$(jq -r '(.severity // "unknown") | tostring | .[0:40] | @json' <<<"$FLUX_EVENT")"
            printf 'This event is unverified and is not a deployment or service acceptance receipt.\n'
          } >> "$GITHUB_STEP_SUMMARY"
