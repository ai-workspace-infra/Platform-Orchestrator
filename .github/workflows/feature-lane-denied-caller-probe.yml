name: Feature Vault denied caller probe
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  denied:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify a different workflow is denied
        run: python3 .github/scripts/feature-lane/vault-probe.py denied-caller
      - name: Verify deployment evidence identity rejects another workflow
        run: python3 .github/scripts/feature-lane/vault-probe.py deploy-denied
      - name: Verify provider target identity rejects another workflow
        run: python3 .github/scripts/feature-lane/vault-probe.py target-denied
