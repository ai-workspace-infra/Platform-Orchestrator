name: Selfhost Orchestrator

# =============================================================================
# IaC 环境交付与应用部署流水线 (Environment Provisioning & Deployment)
# Resolve → IaC/Provision → Deploy → Migrate/Configure → Verify
# =============================================================================

on:
  # Branches select a delivery profile. pull_request and branch/tag pushes
  # always run the provision stage, but only workflow_dispatch can request an
  # actual apply/deploy run.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/deploy-action-runner-iac.yaml'
  push:
    branches:
    - main
    - 'release/**'
    tags:
    - 'v*'
    paths-ignore:
      - '.github/workflows/deploy-action-runner-iac.yaml'
  workflow_dispatch:
    inputs:
      runner_type:
        description: "选择 Runner 环境 (ubuntu-latest 或 self-hosted)"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
        - ubuntu-latest
        - self-hosted
      deploy_tag:
        description: "应用部署的不可变镜像版本（例如 daily-build-2026.07.30-r1）。operation=deploy 或 deploy+migrate 时必填；基础设施、迁移操作可留空。"
        required: false
        type: string
      source_ref:
        description: '常规路径使用 Git Ref；V6 必填 JSON：{"gitops":"<tag>","playbooks":"<branch-or-tag>","iac":"<branch-or-tag>"}；预检解析后固定 SHA'
        required: false
        default: ""
        type: string
      offline_mode:
        description: "on-host 离线包模式: off=在线拉最新(默认); auto=离线加速; force=强制离线"
        required: false
        default: "off"
        type: choice
        options: ["off", "auto", "force"]
      source_host:
        description: "源环境 IP 或域名 (用于导出数据)"
        required: true
        default: "install.svc.plus"
        type: string
      source_domain_base:
        description: "源环境域名后缀 (例如 svc.plus)"
        required: true
        default: "svc.plus"
        type: string
      target_domain_base:
        description: "新环境域名后缀 (用于参数化替换，如 onwalk.net)"
        required: true
        default: "onwalk.net"
        type: string
      observability_endpoint:
        description: "监控数据上报网关 (默认 https://observability.svc.plus)，支持覆盖"
        required: false
        default: "https://observability.svc.plus"
        type: string
      xray_exporter_image:
        description: "可选 Xray Exporter 覆盖，格式 owner/repository@tag；留空使用环境默认"
        required: false
        default: ""
        type: string
      operation:
        description: "plan=校验；infra=基础设施（V6 自动 common 检查）；deploy=应用（V6 为新资源与暂停式集群引导）；deploy+init=UAT空库初始化+应用；deploy+migrate=应用+迁移；migrate=仅迁移；destroy=销毁"
        required: true
        default: "plan"
        type: choice
        options: [plan, infra, deploy, deploy+init, deploy+migrate, migrate, destroy]
      target_domains:
        description: "选择要执行的业务域 (Business Domain)"
        required: true
        default: "web-saas"
        type: choice
        options:
        - all
        - ai-workspace
        - web-saas
        - open-platform
        - infra-platform
        - agent-proxy
        - agent-proxy-jp
        - agent-proxy-us
        - agent-proxy-sg
        - web-saas + agent-proxy
      open_platform_service:
        description: "旧 open-platform 服务部署：none=跳过；共享服务使用 Open Platform Orchestrator"
        required: true
        default: "none"
        type: choice
        options: [none, all, vault, iam, observability]
      cloud_provider:
        description: "云服务商（按 UAT Hybrid/GitOps provider registry 选择；不要用单一 provider 覆盖 target_domains=all；ULightHost existing 由 external adapter 处理）"
        required: true
        default: "gcp-cloud"
        type: choice
        options:
        - aws-cloud
        - gcp-cloud
        - azure-cloud
        - vultr-vps
        - akamai-cloud
        - ucloud
      cloud_account:
        description: "所选云厂商的具体账户名/ID；留空时使用环境 profile 的账户"
        required: false
        default: ""
        type: string
      akamai_account:
        description: "Akamai Cloud concrete account name/ID used by the state key; blank uses cloud_account or the environment profile"
        required: false
        default: ""
        type: string
      include_external_agent_proxy:
        description: "是否部署 GitOps 声明的 Ulighthost existing Agent Proxy 节点"
        required: false
        default: true
        type: boolean
      instance_plan:
        description: "选择默认业务规格（UAT Hybrid 的 provider、创建或复用方式及规格以 GitOps namespace 声明为准）"
        required: true
        default: "2C4G"
        type: choice
        options:
        - 4C8G
        - 2C4G
        - 2C8G
        - 2C2G
        - 1C2G
      agent_proxy_plan:
        description: "Agent Proxy 运行时规格（UAT/PROD 默认 1C2G；不默认创建 AWS Spot）"
        required: true
        default: "1C2G"
        type: choice
        options:
        - 1C1G
        - 1C2G
        - 2C1G
        - 2C2G
      dns_mode:
        description: "DNS 行为：none 不发布；uat-records 更新 SIT all-in-one 或 UAT 固定记录；prod-cutover 接管生产流量；destroy 操作始终忽略 DNS 输入"
        required: true
        default: "none"
        type: choice
        options: [none, uat-records, prod-cutover]
      vault_env_path:
        description: "环境配置：sit、uat、prod 或 prod-v<整数>；prod-v* 共用 PROD secrets，独立 GitOps/state"
        required: true
        default: "uat"
        type: string
      skip_stripe_catalog:
        description: "跳过可选 Stripe Catalog 同步，不阻断核心发布"
        required: false
        default: false
        type: boolean
      agent_controller_url:
        description: "Agent Proxy 注册到的 Accounts 控制器 HTTPS 地址；留空使用同一 Selfhost Web SaaS Accounts"
        required: false
        default: ""
        type: string
      vault_addr:
        description: "Vault 服务地址 (可选，覆盖默认的 https://vault.svc.plus)"
        required: false
        type: string
      xconnect_gateway_ref:
        description: "UAT XConnect Gateway DNS/Vault record key; other XConnect settings use the target workflow defaults"
        required: false
        default: "tw-xconnect.svc.plus"
        type: string
      existing_target_host:
        description: "Existing host deployment target. Only ai-workspace UAT accepts this; no Terraform state or destroy is performed."
        required: false
        default: ""
        type: string
      # 注意: 这里曾有一个 vault_token 输入作为 "JWT 异常时的兜底"。已移除。
      # workflow_dispatch 输入不脱敏且长期留在 run metadata 里, 任何有仓库读
      # 权限的人都能看到; 且 method:token 会绕过 role 上全部 bound_claims 绑定,
      # 等于给整套 OIDC 开一个常驻后门。JWT 认证有问题就修 role 绑定, 不要旁路。

permissions:
  contents: read
  actions: write

concurrency:
  # Aggregate UAT deployment is a parent orchestrator that dispatches child
  # runs of this same workflow. Include target_domains so the parent `all`
  # lock does not block its isolated namespace child lock.
  group: deploy-env-migration-${{ github.event.inputs.vault_env_path || 'uat' }}-${{ github.event.inputs.cloud_provider || 'auto' }}-${{ github.event.inputs.cloud_account || github.event.inputs.akamai_account || 'profile' }}-${{ github.event.inputs.target_domains || 'auto' }}
  cancel-in-progress: false


jobs:
  resolve:
    name: "[1/5] Resolve & Validate"
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v6.') && !(github.event_name == 'workflow_dispatch' && inputs.vault_env_path == 'prod-v6') }}
    runs-on: ubuntu-latest
    timeout-minutes: 359
    outputs:
      payload_json: ${{ steps.request.outputs.payload_json }}
      context: ${{ steps.dispatch.outputs.context }}
      run_id: ${{ steps.dispatch.outputs.run_id }}
      run_attempt: ${{ steps.dispatch.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Capture immutable parent request
        id: request
        env:
          PARENT_EVENT_NAME: ${{ github.event_name }}
          PARENT_REF_NAME: ${{ github.ref_name }}
          PARENT_HEAD_SHA: ${{ github.sha }}
          REQUEST_INPUTS_JSON: ${{ toJSON(inputs || github.event.inputs || fromJSON('{}')) }}
        run: |
          python3 - <<'PY'
          import json, os, uuid
          from pathlib import Path
          payload = json.loads(os.environ["REQUEST_INPUTS_JSON"] or "{}")
          payload.update({
              "__parent_event_name": os.environ["PARENT_EVENT_NAME"],
              "__parent_ref_name": os.environ["PARENT_REF_NAME"],
              "__parent_head_sha": os.environ["PARENT_HEAD_SHA"],
          })
          encoded = json.dumps(payload, separators=(",", ":"))
          path = Path(os.environ["RUNNER_TEMP"]) / "selfhost-parent-request.json"
          path.write_text(encoded + "\n", encoding="utf-8")
          delimiter = "REQUEST_" + uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"payload_json<<{delimiter}\n{encoded}\n{delimiter}\n")
          PY
      - name: Retain immutable parent request for child validation
        uses: actions/upload-artifact@v7
        with:
          name: selfhost-parent-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selfhost-parent-request.json
          if-no-files-found: error
      - name: Dispatch Resolve stage and wait for its exact result
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SELFHOST_STAGE: resolve
          SELFHOST_STAGE_REF: ${{ github.ref_name }}
          SELFHOST_REQUEST_JSON: ${{ steps.request.outputs.payload_json }}
        run: python3 .github/scripts/platform-ops/stage-dispatch.py
      - name: Retain Resolve result for downstream stage authorization
        uses: actions/upload-artifact@v7
        with:
          name: selfhost-parent-stage-resolve-${{ github.run_attempt }}
          path: ${{ steps.dispatch.outputs.result_file }}
          if-no-files-found: error

  infrastructure:
    name: "[2/5] IaC & Provision"
    needs: resolve
    if: ${{ needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 359
    outputs:
      context: ${{ steps.dispatch.outputs.context }}
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Dispatch IaC & Provision stage and wait for its exact result
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SELFHOST_STAGE: infra
          SELFHOST_STAGE_REF: ${{ github.ref_name }}
          SELFHOST_REQUEST_JSON: ${{ needs.resolve.outputs.payload_json }}
          SELFHOST_RESOLVE_CONTEXT: ${{ needs.resolve.outputs.context }}
          SELFHOST_RESOLVE_RUN_ID: ${{ needs.resolve.outputs.run_id }}
          SELFHOST_RESOLVE_RUN_ATTEMPT: ${{ needs.resolve.outputs.run_attempt }}
        run: python3 .github/scripts/platform-ops/stage-dispatch.py
      - name: Retain Infrastructure result for downstream stage authorization
        uses: actions/upload-artifact@v7
        with:
          name: selfhost-parent-stage-infra-${{ github.run_attempt }}
          path: ${{ steps.dispatch.outputs.result_file }}
          if-no-files-found: error

  deploy:
    name: "[3/5] Deploy"
    needs: [resolve, infrastructure]
    if: ${{ needs.infrastructure.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 359
    outputs:
      context: ${{ steps.dispatch.outputs.context }}
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Dispatch Deploy stage and wait for its exact result
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SELFHOST_STAGE: deploy
          SELFHOST_STAGE_REF: ${{ github.ref_name }}
          SELFHOST_REQUEST_JSON: ${{ needs.resolve.outputs.payload_json }}
          SELFHOST_PROVISION_CONTEXT: ${{ needs.infrastructure.outputs.context }}
          SELFHOST_INFRA_RUN_ID: ${{ needs.infrastructure.outputs.run_id }}
          SELFHOST_RESOLVE_RUN_ID: ${{ needs.resolve.outputs.run_id }}
          SELFHOST_RESOLVE_RUN_ATTEMPT: ${{ needs.resolve.outputs.run_attempt }}
        run: python3 .github/scripts/platform-ops/stage-dispatch.py
      - name: Retain Deploy result for downstream stage authorization
        uses: actions/upload-artifact@v7
        with:
          name: selfhost-parent-stage-deploy-${{ github.run_attempt }}
          path: ${{ steps.dispatch.outputs.result_file }}
          if-no-files-found: error

  migrate:
    name: "[4/5] Migrate & Configure"
    needs: [resolve, infrastructure, deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 359
    outputs:
      context: ${{ steps.dispatch.outputs.context }}
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Dispatch Migrate & Configure stage and wait for its exact result
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SELFHOST_STAGE: migrate
          SELFHOST_STAGE_REF: ${{ github.ref_name }}
          SELFHOST_REQUEST_JSON: ${{ needs.resolve.outputs.payload_json }}
          SELFHOST_PROVISION_CONTEXT: ${{ needs.infrastructure.outputs.context }}
          SELFHOST_DEPLOY_CONTEXT: ${{ needs.deploy.outputs.context }}
          SELFHOST_INFRA_RUN_ID: ${{ needs.infrastructure.outputs.run_id }}
          SELFHOST_DEPLOY_RUN_ID: ${{ needs.deploy.outputs.run_id }}
        run: python3 .github/scripts/platform-ops/stage-dispatch.py
      - name: Retain Migrate result for downstream stage authorization
        uses: actions/upload-artifact@v7
        with:
          name: selfhost-parent-stage-migrate-${{ github.run_attempt }}
          path: ${{ steps.dispatch.outputs.result_file }}
          if-no-files-found: error

  verify:
    name: "[5/5] Verify & Report"
    needs: [resolve, infrastructure, deploy, migrate]
    if: ${{ needs.migrate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 359
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Dispatch Verify stage and wait for its exact result
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SELFHOST_STAGE: verify
          SELFHOST_STAGE_REF: ${{ github.ref_name }}
          SELFHOST_REQUEST_JSON: ${{ needs.resolve.outputs.payload_json }}
          SELFHOST_PROVISION_CONTEXT: ${{ needs.infrastructure.outputs.context }}
          SELFHOST_DEPLOY_CONTEXT: ${{ needs.deploy.outputs.context }}
          SELFHOST_MIGRATION_CONTEXT: ${{ needs.migrate.outputs.context }}
          SELFHOST_INFRA_RUN_ID: ${{ needs.infrastructure.outputs.run_id }}
          SELFHOST_DEPLOY_RUN_ID: ${{ needs.deploy.outputs.run_id }}
          SELFHOST_MIGRATION_RUN_ID: ${{ needs.migrate.outputs.run_id }}
        run: python3 .github/scripts/platform-ops/stage-dispatch.py

  v6-resolve:
    name: '[V6 1/4] Validate cold bootstrap'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vault_env_path == 'prod-v6' }}
    runs-on: ubuntu-latest
    outputs:
      gitops_sha: ${{ steps.resolve.outputs.gitops_sha }}
      iac_sha: ${{ steps.resolve.outputs.iac_sha }}
      playbooks_sha: ${{ steps.resolve.outputs.playbooks_sha }}
      target_manifest: ${{ steps.resolve.outputs.target_manifest }}
      action: ${{ steps.resolve.outputs.action }}
      environment: ${{ steps.resolve.outputs.environment }}
      account: ${{ steps.resolve.outputs.account }}
      node: ${{ steps.resolve.outputs.node }}
      selectors: ${{ steps.resolve.outputs.selectors }}
      vault_address: ${{ steps.resolve.outputs.vault_address }}
      vault_role: ${{ steps.resolve.outputs.vault_role }}
      ssh_record: ${{ steps.resolve.outputs.ssh_record }}
      provider_record: ${{ steps.resolve.outputs.provider_record }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.2
      - id: refs
        env:
          V6_INPUTS: ${{ toJSON(inputs) }}
          V6_RESOLVE_REFS: 'true'
        run: python3 .github/scripts/platform-ops/provision/resolve-prod-k3s-v6.py
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ steps.refs.outputs.gitops_ref }}
          fetch-depth: 0
          path: gitops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ steps.refs.outputs.playbooks_ref }}
          fetch-depth: 0
          path: playbooks-candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ steps.refs.outputs.iac_ref }}
          fetch-depth: 0
          path: iac-candidate
          persist-credentials: false
      - id: resolve
        env:
          V6_INPUTS: ${{ toJSON(inputs) }}
          V6_GITOPS: ${{ github.workspace }}/gitops
          V6_PLAYBOOKS: ${{ github.workspace }}/playbooks-candidate
          V6_IAC: ${{ github.workspace }}/iac-candidate
        run: python3 .github/scripts/platform-ops/provision/resolve-prod-k3s-v6.py

  v6-iac:
    name: '[V6 2/4] Create isolated resources'
    needs: v6-resolve
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    outputs:
      child_run_id: ${{ steps.iac.outputs.child_run_id }}
      child_run_attempt: ${{ steps.iac.outputs.child_run_attempt }}
      receipt_artifact_id: ${{ steps.iac.outputs.receipt_artifact_id }}
      receipt_sha256: ${{ steps.iac.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: iac
        env:
          GH_TOKEN: ${{ github.token }}
          IAC_ACTION: ${{ needs.v6-resolve.outputs.action }}
          IAC_ENVIRONMENT: ${{ needs.v6-resolve.outputs.environment }}
          IAC_TARGET_MANIFEST: ${{ needs.v6-resolve.outputs.target_manifest }}
          IAC_GITOPS_REF: ${{ needs.v6-resolve.outputs.gitops_sha }}
          IAC_REF: ${{ needs.v6-resolve.outputs.iac_sha }}
          IAC_STAGE_SCOPE: resources
          IAC_BOOTSTRAP_MODE: verify
          IAC_DISPATCH_REF: ${{ github.ref_name }}
          IAC_CORRELATION_ID: ${{ github.run_id }}:${{ github.run_attempt }}:${{ needs.v6-resolve.outputs.node }}
          IAC_SELECTORS: ${{ needs.v6-resolve.outputs.selectors }}
        run: python3 .github/scripts/platform-ops/provision/dispatch-iac-pipeline.py

  v6-bootstrap:
    name: '[V6 3/4] Common checks and paused cluster bootstrap'
    if: ${{ inputs.operation != 'plan' }}
    needs: [v6-resolve, v6-iac]
    environment: ${{ needs.v6-resolve.outputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ needs.v6-resolve.outputs.iac_sha }}
          path: iac_modules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ needs.v6-resolve.outputs.playbooks_sha }}
          path: playbooks
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ needs.v6-resolve.outputs.gitops_sha }}
          fetch-depth: 0
          path: gitops
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.v6-iac.outputs.receipt_artifact_id }}
          run-id: ${{ needs.v6-iac.outputs.child_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v6-iac-summary
          merge-multiple: true
      - uses: ./iac_modules/.github/actions/iac-receipt-verify
        with:
          summary-file: ${{ runner.temp }}/v6-iac-summary/summary.json
          receipt-sha256: ${{ needs.v6-iac.outputs.receipt_sha256 }}
          run-id: ${{ needs.v6-iac.outputs.child_run_id }}
          run-attempt: ${{ needs.v6-iac.outputs.child_run_attempt }}
          gitops-sha: ${{ needs.v6-resolve.outputs.gitops_sha }}
          iac-sha: ${{ needs.v6-resolve.outputs.iac_sha }}
          target-manifest: ${{ needs.v6-resolve.outputs.target_manifest }}
          action: apply
          correlation-id: ${{ github.run_id }}:${{ github.run_attempt }}:${{ needs.v6-resolve.outputs.node }}
      - uses: ./iac_modules/.github/actions/iac-caller-inventory
        with:
          summary-file: ${{ runner.temp }}/v6-iac-summary/summary.json
          output-dir: ${{ runner.temp }}/v6-cmdb
      - id: checksum
        env:
          V6_CMDB: ${{ runner.temp }}/v6-cmdb/cmdb.json
        run: echo "sha256=$(sha256sum "$V6_CMDB" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ needs.v6-resolve.outputs.vault_address }}
          method: jwt
          role: ${{ needs.v6-resolve.outputs.vault_role }}
          jwtGithubAudience: vault
          exportEnv: false
          exportToken: false
          secrets: |
            ${{ needs.v6-resolve.outputs.ssh_record }} SSH_PRIVATE_KEY | SSH_PRIVATE_KEY ;
            ${{ needs.v6-resolve.outputs.provider_record }} LINODE_TOKEN | LINODE_TOKEN ;
      - id: identity
        uses: ./iac_modules/.github/actions/akamai-candidate-hostkey
        env:
          LINODE_TOKEN: ${{ steps.vault.outputs.LINODE_TOKEN }}
        with:
          cmdb-file: ${{ runner.temp }}/v6-cmdb/cmdb.json
          cmdb-sha256: ${{ steps.checksum.outputs.sha256 }}
          account: ${{ needs.v6-resolve.outputs.account }}
          node: ${{ needs.v6-resolve.outputs.node }}
          output-dir: ${{ runner.temp }}/v6-hostkey
      - uses: ./playbooks/.github/actions/prod-k3s-bootstrap
        env:
          SSH_PRIVATE_KEY: ${{ steps.vault.outputs.SSH_PRIVATE_KEY }}
        with:
          phase: ${{ inputs.operation == 'infra' && 'common' || 'cluster' }}
          cmdb: ${{ runner.temp }}/v6-cmdb/cmdb.json
          cmdb-sha256: ${{ steps.checksum.outputs.sha256 }}
          gitops: ${{ github.workspace }}/gitops
          gitops-sha: ${{ needs.v6-resolve.outputs.gitops_sha }}
          known-hosts: ${{ steps.identity.outputs.known-hosts }}
          receipt: ${{ runner.temp }}/v6-bootstrap-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.v6-resolve.outputs.node }}-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-bootstrap-receipt.json
          if-no-files-found: error

  v6-summary:
    name: '[V6 4/4] Record cold bootstrap boundary'
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.vault_env_path == 'prod-v6' }}
    needs: [v6-resolve, v6-iac, v6-bootstrap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prod-k3s-summary
        with:
