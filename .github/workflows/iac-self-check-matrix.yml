name: CI / Multi-cloud IaC Contracts
'on':
  workflow_dispatch:
    inputs:
      gitops_ref:
        description: Reviewed declarations for static checks
        type: string
        default: main
      iac_ref:
        description: Fixed IaC owner version for static checks
        type: string
        default: 8f49ea39d07e3192353058aeca72bb8293ae6cb5
      cloud_providers:
        description: Providers to check; empty selects all six
        type: string
        default: aws-cloud,azure-cloud,vultr-vps,gcp-cloud,ucloud,akamai-cloud
  pull_request:
    paths:
      - .github/workflows/iac-*
      - terraform-hcl-standard/**
      - scripts/ci/unified_iac_contract_test.py
  push:
    branches: [main, release/**]
    paths:
      - .github/workflows/iac-*
      - terraform-hcl-standard/**
      - scripts/ci/unified_iac_contract_test.py
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.mode.outputs.action }}
      providers: ${{ steps.mode.outputs.providers }}
    steps:
      - id: mode
        shell: bash
        env:
          PROVIDERS: ${{ inputs.cloud_providers }}
        run: |
          python3 - <<'PYCODE'
          import os
          supported = {'aws-cloud', 'azure-cloud', 'vultr-vps', 'gcp-cloud', 'ucloud', 'akamai-cloud'}
          providers = os.environ['PROVIDERS'] or 'aws-cloud,azure-cloud,vultr-vps,gcp-cloud,ucloud,akamai-cloud'
          assert set(providers.split(',')) <= supported
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('action=check\nproviders=' + providers + '\n')
          PYCODE
  self-check:
    needs: prepare
    if: needs.prepare.outputs.action == 'check'
    runs-on: ubuntu-latest
    outputs:
      report_sha256: ${{ steps.check.outputs.report_sha256 }}
      iac_sha: ${{ steps.check.outputs.iac_sha }}
      gitops_sha: ${{ steps.check.outputs.gitops_sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ inputs.iac_ref || '8f49ea39d07e3192353058aeca72bb8293ae6cb5' }}
          path: iac_modules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref || 'main' }}
          path: gitops
          persist-credentials: false
      - id: check
        uses: ./iac_modules/.github/actions/iac-self-check
        with:
          iac-root: ${{ github.workspace }}/iac_modules
          gitops-root: ${{ github.workspace }}/gitops
          providers: ${{ needs.prepare.outputs.providers }}
          report-file: ${{ runner.temp }}/iac-static/report.json
      - id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: iac-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iac-static
          if-no-files-found: error
  execute-iac:
    # The fixed owner's entry-summary contract requires an explicit skipped
    # execution result. This preserves that shape without a deployment path.
    name: Reject deployment actions in static CI
    needs: prepare
    if: needs.prepare.outputs.action != 'check'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '::error::Use iac-orchestrator.yml for plan/apply/destroy.'
          exit 1
  summary:
    if: ${{ always() }}
    needs: [prepare, self-check, execute-iac]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful preparation
        if: needs.prepare.result != 'success'
        run: |
          echo '::error::Static IaC preparation failed'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ needs.self-check.outputs.iac_sha }}
          path: iac_modules
          persist-credentials: false
      - if: needs.self-check.result == 'success'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.self-check.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/iac-static
      - id: verify
        uses: ./iac_modules/.github/actions/iac-entry-summary
        with:
          needs-json: ${{ toJSON(needs) }}
          iac-root: ${{ github.workspace }}/iac_modules
          report-file: ${{ runner.temp }}/iac-static/report.json
          summary-file: ${{ runner.temp }}/iac-summary/summary.json
          target-manifest: ''
          correlation-id: ${{ github.run_id }}:${{ github.run_attempt }}:static
