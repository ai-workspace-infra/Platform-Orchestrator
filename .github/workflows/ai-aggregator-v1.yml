# workflow-meta:
#   purpose: orchestrate
#   execution-path: direct-ansible, direct-terraform, direct-cli, composite-actions
#   flux-reconciliation: no
name: AI Aggregator Orchestrator

on:
  push:
    branches: [main]
    # Pushes validate declarations; deployments require explicit dispatch inputs.
    paths:
      - '.github/workflows/ai-aggregator-v1.yml'
      - '.github/workflows/iac-orchestrator.yml'
      - 'scripts/ci/**'
      - 'scripts/verify_ai_aggregator_endpoints.sh'
      - 'scripts/vault/initialize_ai_aggregator_paths.sh'
      - 'docs/plans/**'
  pull_request:
    paths:
      - '.github/workflows/ai-aggregator-v1.yml'
      - '.github/workflows/iac-orchestrator.yml'
      - 'scripts/ci/*ai_aggregator*.py'
      - 'scripts/verify_ai_aggregator_endpoints.sh'
  workflow_dispatch:
    inputs:
      operation:
        description: "plan validates; apply/provision creates declared resources; stage deploys; activate enables services"
        required: true
        default: plan
        type: choice
        options: [plan, apply, provision, stage, activate]
      environment:
        description: "Choose the GitOps deployment environment"
        required: true
        type: choice
        options: [uat, prod]
      deployment_profile:
        description: "GitOps topology profile; single-node is the default cloud all-in-one path"
        required: true
        default: single-node
        type: choice
        options: [single-node, distributed]
      gitops_ref:
        description: "Immutable GitOps ref"
        required: true
        default: main
      playbooks_ref:
        description: "Immutable Playbooks ref"
        required: true
        default: main
      iac_ref:
        description: IaC owner source ref, resolved to a full SHA before use
        required: true
        default: main
      target_hostname:
        description: Exact hostname asserted against the selected GitOps declaration
        required: false
        default: ''
        type: string
      target_domain:
        description: Exact business domain asserted against the selected GitOps declaration
        required: false
        default: ''
        type: string
      resource_mode:
        description: create resources, or explicitly require an existing no-change Akamai state
        required: true
        default: create
        type: choice
        options: [create, existing]
      ssh_user:
        description: "Optional SSH user assertion against the selected GitOps node"
        required: false
        default: ''
        type: string
      provider:
        description: "Cloud selected by this dispatch; GitOps provides the corresponding resource template"
        required: true
        default: akamai-cloud
        type: choice
        options: [gcp, aws, vps, akamai-cloud]
      destroy:
        description: "Destroy only where an owner explicitly supports ephemeral cleanup; persistent Akamai resources are never auto-destroyed"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-aggregator-v1-${{ inputs.environment || github.head_ref || 'validation' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest parser
        run: pip install --quiet pyyaml
      - name: Checkout GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref || 'main' }}
          path: gitops
      - name: Validate declared AI Aggregator environments
        run: |
          set -euo pipefail
          mapfile -d '' manifests < <(find gitops/topology -type f -path '*/selfhost/ai-aggregator*.yaml' -print0)
          test "${#manifests[@]}" -gt 0
          for manifest in "${manifests[@]}"; do
            python3 scripts/ci/validate_ai_aggregator_manifest.py "$manifest"
          done
      - name: Verify AI Aggregator contracts
        run: python3 -m unittest discover -s scripts/ci -p 'test_ai_aggregator*.py'
      - name: Reject deprecated AI Aggregator Vault references
        run: |
          if rg -n --glob 'ai-aggregator*.yaml' \
            'vault://kv/[^/]+/ai-aggregator/(accounts|instances|clients|cpa)/|vault://kv/[^/]+/ai-aggregator/database/postgresql|#(api_client_token|oauth_bundle|channel_token)' \
            gitops/topology; then
            echo 'deprecated AI Aggregator Vault reference detected' >&2
            exit 1
          fi

  resolve-provider:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.provider.outputs.provider }}
      environment: ${{ steps.provider.outputs.environment }}
      profile: ${{ steps.provider.outputs.profile }}
      manifest_path: ${{ steps.provider.outputs.manifest_path }}
      domain_base: ${{ steps.provider.outputs.domain_base }}
      gitops_ref: ${{ steps.gitops_revision.outputs.ref }}
      target_hostname: ${{ steps.provider.outputs.target_hostname }}
      target_domain: ${{ steps.provider.outputs.target_domain }}
      ssh_user: ${{ steps.provider.outputs.ssh_user }}
      resource_mode: ${{ steps.provider.outputs.resource_mode }}
      service_manifest: ${{ steps.provider.outputs.service_manifest }}
      iac_target_manifest: ${{ steps.provider.outputs.iac_target_manifest }}
      account: ${{ steps.provider.outputs.account }}
      playbooks_sha: ${{ steps.playbooks_revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref || 'main' }}
          path: gitops
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.playbooks_ref || 'main' }}
          path: playbooks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest parser
        run: pip install --quiet pyyaml
      - name: Pin the checked-out GitOps declaration
        id: gitops_revision
        run: echo "ref=$(git -C gitops rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pin the checked-out Playbooks owner
        id: playbooks_revision
        run: echo "sha=$(git -C playbooks rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve input-selected environment and provider
        id: provider
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
          OPERATION: ${{ inputs.operation }}
          TARGET_HOSTNAME: ${{ inputs.target_hostname }}
          TARGET_DOMAIN: ${{ inputs.target_domain }}
          SSH_USER: ${{ inputs.ssh_user }}
          RESOURCE_MODE: ${{ inputs.resource_mode }}
        run: |
          python3 scripts/ci/resolve_ai_aggregator_deployment.py \
            --environment "$REQUESTED_ENVIRONMENT" \
            --profile "$DEPLOYMENT_PROFILE" \
            --provider "$REQUESTED_PROVIDER" \
            --operation "$OPERATION" \
            --target-hostname "$TARGET_HOSTNAME" \
            --target-domain "$TARGET_DOMAIN" \
            --ssh-user "$SSH_USER" \
            --resource-mode "$RESOURCE_MODE" \
            --output "$GITHUB_OUTPUT"

  plan:
    needs: [validate, resolve-provider]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ needs.resolve-provider.outputs.playbooks_sha }}
          path: playbooks
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ needs.resolve-provider.outputs.gitops_ref }}
          path: gitops
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible
        run: pip install --quiet ansible-core pyyaml
      - name: Render input-selected deployment declaration
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
          OPERATION: ${{ inputs.operation }}
          TARGET_HOSTNAME: ${{ inputs.target_hostname }}
          TARGET_DOMAIN: ${{ inputs.target_domain }}
          SSH_USER: ${{ inputs.ssh_user }}
          RESOURCE_MODE: ${{ inputs.resource_mode }}
        run: |
          python3 scripts/ci/resolve_ai_aggregator_deployment.py \
            --environment "$REQUESTED_ENVIRONMENT" \
            --profile "$DEPLOYMENT_PROFILE" \
            --provider "$REQUESTED_PROVIDER" \
            --operation "$OPERATION" \
            --target-hostname "$TARGET_HOSTNAME" \
            --target-domain "$TARGET_DOMAIN" \
            --ssh-user "$SSH_USER" \
            --resource-mode "$RESOURCE_MODE" \
            --output "$RUNNER_TEMP/ai-aggregator-deployment-output"
          python3 scripts/ci/validate_ai_aggregator_manifest.py \
            "${{ needs.resolve-provider.outputs.manifest_path }}"
      - name: Check deployment syntax
        working-directory: playbooks
        run: |
          ansible-playbook --syntax-check -i localhost, deploy-ai-aggregator-v1.yml \
            -e ai_aggregator_manifest_file=${{ github.workspace }}/${{ needs.resolve-provider.outputs.manifest_path }}
          ansible-playbook --syntax-check -i localhost, deploy_ai_aggregator.yaml

  aws-deploy:
    needs: [validate, resolve-provider, plan]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      needs.resolve-provider.outputs.provider == 'aws' &&
      contains(fromJSON('["apply","provision","stage","activate"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    # Do not attach the GitHub Environment here. Its OIDC subject becomes
    # `repo:...:environment:<name>`, while the least-privilege AWS role is
    # intentionally trusted only for the protected main branch ref.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ needs.resolve-provider.outputs.gitops_ref }}
          path: gitops
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ needs.resolve-provider.outputs.playbooks_sha }}
          path: playbooks
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          path: iac_modules
          sparse-checkout: |
            terraform-hcl-standard
      - name: Set up Terraform and Python
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render and Ansible dependencies
        run: pip install --quiet pyyaml jinja2 ansible-core
      - name: Render input-selected deployment declaration
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python3 scripts/ci/resolve_ai_aggregator_deployment.py \
            --environment "$REQUESTED_ENVIRONMENT" \
            --profile "$DEPLOYMENT_PROFILE" \
            --provider "$REQUESTED_PROVIDER" \
            --operation "$OPERATION" \
            --output "$RUNNER_TEMP/ai-aggregator-deployment-output"
          python3 scripts/ci/validate_ai_aggregator_manifest.py \
            "${{ needs.resolve-provider.outputs.manifest_path }}"
      - name: Resolve the selected resource contract from GitOps
        id: contract
        env:
          GITOPS_MANIFEST: ${{ github.workspace }}/${{ needs.resolve-provider.outputs.manifest_path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path(os.environ['GITOPS_MANIFEST']).read_text())
          contract = manifest['spec']['infrastructure']['resource_contract']
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'iac_modules'
          resources = root / contract['path']
          workdir = root / contract['workdir']
          if not resources.is_file():
              raise SystemExit(f'missing declared resource contract: {resources}')
          print(f'resources={resources}')
          print(f'workdir={workdir}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'resources={resources}\nworkdir={workdir}\n')
          PY
      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IAC_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Login to Vault with GitHub OIDC
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["apply","provision","stage","activate"]'), inputs.operation) }}
        id: vault_login
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ vars.VAULT_JWT_ROLE }}
          jwtGithubAudience: vault
          exportToken: true
      - name: Render selected AWS resources
        env:
          TARGET_DOMAIN_BASE: ${{ needs.resolve-provider.outputs.domain_base }}
          AI_AGGREGATOR_SSH_CIDR: ${{ vars.AI_AGGREGATOR_SSH_CIDR }}
          AI_AGGREGATOR_SOURCE_CIDR: ${{ vars.AI_AGGREGATOR_SOURCE_CIDR }}
          AI_AGGREGATOR_SSH_PUBLIC_KEY: ${{ vars.AI_AGGREGATOR_SSH_PUBLIC_KEY }}
        run: |
          python3 iac_modules/terraform-hcl-standard/aws-cloud/scripts/generate.py render \
            --resources "${{ steps.contract.outputs.resources }}" \
            --workdir "${{ steps.contract.outputs.workdir }}"
      - name: Provision selected AWS Spot resources
        env:
          TARGET_DOMAIN_BASE: ${{ needs.resolve-provider.outputs.domain_base }}
          AI_AGGREGATOR_SSH_CIDR: ${{ vars.AI_AGGREGATOR_SSH_CIDR }}
          AI_AGGREGATOR_SOURCE_CIDR: ${{ vars.AI_AGGREGATOR_SOURCE_CIDR }}
          AI_AGGREGATOR_SSH_PUBLIC_KEY: ${{ vars.AI_AGGREGATOR_SSH_PUBLIC_KEY }}
        run: |
          terraform -chdir="${{ steps.contract.outputs.workdir }}" fmt -recursive
          # This adapter handles declared ephemeral resources. Keep Terraform state on
          # the runner so no state bucket contract is required for this flow.
          rm -f "${{ steps.contract.outputs.workdir }}/backend.tf"
          terraform -chdir="${{ steps.contract.outputs.workdir }}" init -backend=false
          key_metadata="$(python3 - "${{ steps.contract.outputs.resources }}" <<'PY'
          import re
          import sys
          from pathlib import Path
          import yaml

          source = re.sub(r"\{\{.*?\}\}", "placeholder", Path(sys.argv[1]).read_text())
          data = yaml.safe_load(source)
          key_name = data['ssh_keys'][0]['name']
          tf_id = re.sub(r'[^0-9a-zA-Z_]', '_', str(key_name))
          print(f'{key_name}\t{tf_id}')
          PY
          )"
          IFS=$'\t' read -r key_name key_resource_id <<< "$key_metadata"
          if ! terraform -chdir="${{ steps.contract.outputs.workdir }}" state list | grep -Fxq "aws_key_pair.${key_resource_id}"; then
            terraform -chdir="${{ steps.contract.outputs.workdir }}" import -input=false \
              "aws_key_pair.${key_resource_id}" "$key_name" || \
              echo "No pre-existing contract SSH key found; Terraform will create it."
          fi
          terraform -chdir="${{ steps.contract.outputs.workdir }}" validate
          terraform -chdir="${{ steps.contract.outputs.workdir }}" apply -auto-approve
          python3 iac_modules/terraform-hcl-standard/aws-cloud/scripts/generate.py inventory \
            --resources "${{ steps.contract.outputs.resources }}" \
            --workdir "${{ steps.contract.outputs.workdir }}"
      - name: Deploy Gateway secrets and system configuration
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'stage' || inputs.operation == 'activate') }}
        working-directory: playbooks
        env:
          VAULT_ADDR: https://vault.svc.plus
        run: |
          ansible-playbook -i "${{ steps.contract.outputs.workdir }}/inventory.ini" \
            deploy-ai-aggregator-v1.yml \
            -e ai_aggregator_operation=${{ inputs.operation == 'activate' && 'activate' || 'stage' }} \
            -e ai_aggregator_manifest_file=${{ github.workspace }}/${{ needs.resolve-provider.outputs.manifest_path }}
      - name: Verify selected endpoints
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'activate' }}
        env:
          AI_AGGREGATOR_MANIFEST: ${{ needs.resolve-provider.outputs.manifest_path }}
        run: ./scripts/verify_ai_aggregator_endpoints.sh
      - name: Destroy selected Spot resources
        if: ${{ always() && steps.contract.outputs.workdir != '' && inputs.destroy }}
        run: terraform -chdir="${{ steps.contract.outputs.workdir }}" destroy -auto-approve

  gcp-deploy:
    needs: [validate, resolve-provider, plan]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      needs.resolve-provider.outputs.provider == 'gcp' &&
      contains(fromJSON('["apply","provision","stage","activate"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ needs.resolve-provider.outputs.gitops_ref }}
          path: gitops
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ needs.resolve-provider.outputs.playbooks_sha }}
          path: playbooks
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: d7e49189a5de9c105a940f1c79abfb3b2b33bbd4
          path: iac_modules
          sparse-checkout: |
            .github/actions/auth-gcp-cloud
            terraform-hcl-standard
      - name: Set up Terraform and Python
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render and Ansible dependencies
        run: pip install --quiet pyyaml jinja2 ansible-core
      - name: Render input-selected deployment declaration
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python3 scripts/ci/resolve_ai_aggregator_deployment.py \
            --environment "$REQUESTED_ENVIRONMENT" \
            --profile "$DEPLOYMENT_PROFILE" \
            --provider "$REQUESTED_PROVIDER" \
            --operation "$OPERATION" \
            --output "$RUNNER_TEMP/ai-aggregator-deployment-output"
          python3 scripts/ci/validate_ai_aggregator_manifest.py \
            "${{ needs.resolve-provider.outputs.manifest_path }}"
      - name: Resolve the selected GCP resource contract from GitOps
        id: contract
        env:
          GITOPS_MANIFEST: ${{ github.workspace }}/${{ needs.resolve-provider.outputs.manifest_path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path(os.environ['GITOPS_MANIFEST']).read_text())
          infrastructure = manifest['spec']['infrastructure']
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          contract = infrastructure['resource_contract']
          roots = {
              'ai-workspace-infra/iac_modules': workspace / 'iac_modules',
              'ai-workspace-infra/gitops': workspace / 'gitops',
          }
          resource_root = roots.get(contract.get('repository'))
          workdir_root = roots.get(contract.get('workdir_repository', 'ai-workspace-infra/iac_modules'))
          if resource_root is None or workdir_root is None:
              raise SystemExit('GCP resource_contract repository/workdir_repository is unsupported')
          resources = resource_root / contract['path']
          workdir = workdir_root / contract['workdir']
          if not resources.is_file():
              raise SystemExit(f'missing declared resource contract: {resources}')
          entrypoint = manifest['spec'].get('entrypoint', {})
          gateway_domain = entrypoint.get('domain', '')
          if gateway_domain and any(char.isspace() for char in gateway_domain):
              raise SystemExit('entrypoint.domain must not contain whitespace')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(
                  f'resources={resources}\n'
                  f'workdir={workdir}\n'
                  f'gateway_domain={gateway_domain}\n'
              )
          PY
      - name: Require the GCP Vault OIDC role variable
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["apply","provision","stage","activate"]'), inputs.operation) }}
        env:
          VAULT_GCP_JWT_ROLE: ${{ vars.VAULT_GCP_JWT_ROLE }}
        run: |
          set -euo pipefail
          if [ -z "$VAULT_GCP_JWT_ROLE" ]; then
            echo 'Missing repository/environment variable VAULT_GCP_JWT_ROLE; configure the Vault JWT role before running GCP deployments.' >&2
            exit 1
          fi
      - name: Configure GCP credentials through Vault JWT and Google WIF
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["apply","provision","stage","activate"]'), inputs.operation) }}
        id: gcp_auth
        uses: ./.github/actions/configure-gcp-oidc
        with:
          environment: ${{ needs.resolve-provider.outputs.environment }}
          account_id: ${{ vars.AI_AGGREGATOR_GCP_ACCOUNT || 'xworktech' }}
          vault_role: ${{ vars.VAULT_GCP_JWT_ROLE }}
          load_state_contract: false
      - name: Install Google Cloud CLI for private-node access
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'apply' || inputs.operation == 'provision' || inputs.operation == 'stage' || inputs.operation == 'activate') }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Render selected GCP resources
        env:
          GITOPS_ROOT: ${{ github.workspace }}/gitops
          AI_AGGREGATOR_SSH_CIDR: ${{ vars.AI_AGGREGATOR_SSH_CIDR }}
          AI_AGGREGATOR_SOURCE_CIDR: ${{ vars.AI_AGGREGATOR_SOURCE_CIDR }}
          AI_AGGREGATOR_SSH_PUBLIC_KEY: ${{ vars.AI_AGGREGATOR_SSH_PUBLIC_KEY }}
        run: |
          python3 iac_modules/terraform-hcl-standard/gcp-cloud/scripts/generate.py render \
            --resources "${{ steps.contract.outputs.resources }}" \
            --workdir "${{ steps.contract.outputs.workdir }}"
      - name: Provision selected GCP Spot instance
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["apply","provision","stage","activate"]'), inputs.operation) }}
        env:
          AI_AGGREGATOR_SSH_CIDR: ${{ vars.AI_AGGREGATOR_SSH_CIDR }}
          AI_AGGREGATOR_SOURCE_CIDR: ${{ vars.AI_AGGREGATOR_SOURCE_CIDR }}
          AI_AGGREGATOR_SSH_PUBLIC_KEY: ${{ vars.AI_AGGREGATOR_SSH_PUBLIC_KEY }}
          TARGET_DOMAIN_BASE: ${{ needs.resolve-provider.outputs.domain_base }}
          TF_VAR_deploy_service_account: ${{ steps.gcp_auth.outputs.service_account }}
          TF_VAR_workload_identity_provider: ${{ steps.gcp_auth.outputs.provider }}
          TF_VAR_ssh_public_key: ${{ vars.AI_AGGREGATOR_SSH_PUBLIC_KEY }}
          GCP_PROJECT_ID: ${{ steps.gcp_auth.outputs.project_id }}
        run: |
          set -euo pipefail
          workdir="${{ steps.contract.outputs.workdir }}"
          resources="${{ steps.contract.outputs.resources }}"
          rm -f "${{ steps.contract.outputs.workdir }}/backend.tf"
          terraform -chdir="$workdir" init -backend=false -input=false
          network_metadata="$(python3 - "$resources" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path(sys.argv[1]).read_text())
          global_config = data['global']
          print('\t'.join([
              global_config['network_name'],
              global_config['region'],
              f"{global_config['network_name']}-subnet",
              f"{global_config['network_name']}-router",
              f"{global_config['network_name']}-nat-ip",
              f"{global_config['network_name']}-nat",
          ]))
          PY
          )"
          IFS=$'\t' read -r network_name region subnet_name router_name nat_ip_name nat_name <<< "$network_metadata"
          import_if_absent() {
            local address="$1"
            local resource_id="$2"
            if ! terraform -chdir="$workdir" state list | grep -Fxq "$address"; then
              terraform -chdir="$workdir" import -input=false "$address" "$resource_id" || \
                echo "Declared GCP resource is not pre-existing: $address"
            fi
          }
          import_if_absent module.network.google_compute_network.this \
            "projects/$GCP_PROJECT_ID/global/networks/$network_name"
          import_if_absent module.network.google_compute_subnetwork.this \
            "projects/$GCP_PROJECT_ID/regions/$region/subnetworks/$subnet_name"
          import_if_absent 'module.network.google_compute_router.this[0]' \
            "projects/$GCP_PROJECT_ID/regions/$region/routers/$router_name"
          import_if_absent 'module.network.google_compute_address.nat[0]' \
            "projects/$GCP_PROJECT_ID/regions/$region/addresses/$nat_ip_name"
          import_if_absent 'module.network.google_compute_router_nat.this[0]' \
            "projects/$GCP_PROJECT_ID/regions/$region/routers/$router_name/$nat_name"
          import_if_absent google_compute_firewall.spot_ssh \
            "projects/$GCP_PROJECT_ID/global/firewalls/${network_name}-spot-ssh"
          spot_metadata="$(python3 - "$resources" <<'PY'
          import re
          import sys
          from pathlib import Path
          import yaml

          source = re.sub(r"\{\{.*?\}\}", "placeholder", Path(sys.argv[1]).read_text())
          data = yaml.safe_load(source)
          for vm in data.get('spot_vms', []):
              name = str(vm['name'])
              zone = str(vm['zone'])
              tf_id = re.sub(r'[^0-9a-zA-Z_]', '_', name)
              print(f'{name}\t{zone}\tmodule.spot_{tf_id}.google_compute_instance.this')
          PY
          )"
          while IFS=$'\t' read -r spot_name spot_zone spot_address; do
            [[ -n "$spot_name" ]] || continue
            import_if_absent "$spot_address" \
              "projects/$GCP_PROJECT_ID/zones/$spot_zone/instances/$spot_name"
          done <<< "$spot_metadata"
          terraform -chdir="$workdir" validate
          terraform -chdir="$workdir" apply -input=false -auto-approve
          if [[ "${{ inputs.operation }}" == apply || "${{ inputs.operation }}" == provision || "${{ inputs.operation }}" == stage || "${{ inputs.operation }}" == activate ]]; then
            key_path="${RUNNER_TEMP}/ai-aggregator-gcp-ssh"
            ssh-keygen -t ed25519 -N '' -C "ai-aggregator-${GITHUB_RUN_ID}" -f "$key_path" >/dev/null
            chmod 600 "$key_path"
            gcloud compute os-login ssh-keys add \
              --project="$GCP_PROJECT_ID" --key-file="${key_path}.pub" --ttl=65m >/dev/null
            ssh_user="$(gcloud compute os-login describe-profile \
              --project="$GCP_PROJECT_ID" --format='value(posixAccounts[0].username)')"
            if [[ ! "$ssh_user" =~ ^[a-z_][a-z0-9_-]{0,31}\$?$ ]]; then
              echo 'Invalid GCP OS Login username returned by the deploy principal' >&2
              exit 1
            fi
            export GCP_OSLOGIN_USERNAME="$ssh_user"
            export GCP_SSH_PRIVATE_KEY_FILE="$key_path"
            printf 'GCP_OSLOGIN_USERNAME=%s\nGCP_SSH_PRIVATE_KEY_FILE=%s\n' \
              "$ssh_user" "$key_path" >> "$GITHUB_ENV"
          fi
          python3 iac_modules/terraform-hcl-standard/gcp-cloud/scripts/generate.py inventory \
            --resources "${{ steps.contract.outputs.resources }}" \
            --workdir "${{ steps.contract.outputs.workdir }}"
      - name: Deploy selected GCP services
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'stage' || inputs.operation == 'activate') }}
        working-directory: playbooks
        env:
          VAULT_ADDR: https://vault.svc.plus
        run: |
          set -euo pipefail
          ansible-playbook -i "${{ steps.contract.outputs.workdir }}/inventory.ini" \
            deploy-ai-aggregator-v1.yml \
            -e ai_aggregator_operation=${{ inputs.operation == 'activate' && 'activate' || 'stage' }} \
            -e ai_aggregator_manifest_file=${{ github.workspace }}/${{ needs.resolve-provider.outputs.manifest_path }}
          ansible-playbook -i "${{ steps.contract.outputs.workdir }}/inventory.ini" \
            deploy_ai_desktop.yml \
            -e ai_desktop_cpa_codeagent=true \
            -e ai_desktop_remote_enabled=false \
            -e ai_desktop_manage_user=false
      - name: Load AI Aggregator observability credentials from Vault
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'stage' || inputs.operation == 'activate') }}
        id: observability
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ vars.VAULT_GCP_JWT_ROLE }}
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            kv/data/CICD/observability user | VECTOR_AUTH_USER ;
            kv/data/CICD/observability password | VECTOR_AUTH_PASSWORD
      - name: Deploy selected GCP AI Aggregator observability
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'stage' || inputs.operation == 'activate') }}
        working-directory: playbooks
        env:
          VAULT_ADDR: https://vault.svc.plus
          DEPLOY_ENV: ${{ needs.resolve-provider.outputs.environment }}
          VECTOR_AUTH_USER: ${{ steps.observability.outputs.VECTOR_AUTH_USER }}
          VECTOR_AUTH_PASSWORD: ${{ steps.observability.outputs.VECTOR_AUTH_PASSWORD }}
          VECTOR_AI_AGGREGATOR_ENABLED: 'true'
          VECTOR_AI_AGGREGATOR_PUBLIC_TARGET: https://${{ steps.contract.outputs.gateway_domain }}
        run: |
          set -euo pipefail
          ansible-playbook -i "${{ steps.contract.outputs.workdir }}/inventory.ini" \
            deploy_observability_agent.yml \
            --limit ai_aggregator_gateway \
            -e observability_agent_hosts=ai_aggregator_gateway \
            -e cloud_provider=gcp \
            -e vector_observability_endpoint=https://observability.svc.plus \
            -e observability_service_domain="${{ steps.contract.outputs.gateway_domain }}"
      - name: Revoke temporary GCP OS Login key
        if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.operation == 'apply' || inputs.operation == 'provision' || inputs.operation == 'stage' || inputs.operation == 'activate') }}
        env:
          GCP_PROJECT_ID: ${{ steps.gcp_auth.outputs.project_id }}
        run: |
          set -euo pipefail
          key_path="${GCP_SSH_PRIVATE_KEY_FILE:-}"
          if [[ -n "$key_path" && -s "${key_path}.pub" ]]; then
            gcloud compute os-login ssh-keys remove \
              --project="$GCP_PROJECT_ID" --key-file="${key_path}.pub" || true
            rm -f -- "$key_path" "${key_path}.pub"
          fi
      - name: Verify selected endpoints
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'stage' || inputs.operation == 'activate') }}
        env:
          AI_AGGREGATOR_MANIFEST: ${{ needs.resolve-provider.outputs.manifest_path }}
        run: ./scripts/verify_ai_aggregator_endpoints.sh
      - name: Destroy selected GCP Spot resources
        if: ${{ always() && steps.contract.outputs.workdir != '' && inputs.destroy }}
        run: |
          set -euo pipefail
          workdir="${{ steps.contract.outputs.workdir }}"
          if [ -d "$workdir" ]; then
            rm -f "$workdir/backend.tf"
            terraform -chdir="$workdir" init -backend=false -input=false
            terraform -chdir="$workdir" destroy -input=false -auto-approve
          else
            echo "Terraform workdir was not created; no GCP resource cleanup is required."
          fi

  vps-deploy:
    needs: [validate, resolve-provider, plan]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      needs.resolve-provider.outputs.provider == 'vps' &&
      contains(fromJSON('["apply","provision","stage","activate"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ needs.resolve-provider.outputs.gitops_ref }}
          path: gitops
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ needs.resolve-provider.outputs.playbooks_sha }}
          path: playbooks
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: main
          path: iac_modules
          sparse-checkout: |
            terraform-hcl-standard
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render and Ansible dependencies
        run: pip install --quiet pyyaml jinja2 ansible-core
      - name: Render input-selected deployment declaration
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python3 scripts/ci/resolve_ai_aggregator_deployment.py \
            --environment "$REQUESTED_ENVIRONMENT" \
            --profile "$DEPLOYMENT_PROFILE" \
            --provider "$REQUESTED_PROVIDER" \
            --operation "$OPERATION" \
            --output "$RUNNER_TEMP/ai-aggregator-deployment-output"
          python3 scripts/ci/validate_ai_aggregator_manifest.py \
            "${{ needs.resolve-provider.outputs.manifest_path }}"
      - name: Resolve the selected VPS resource contract from GitOps
        id: contract
        env:
          GITOPS_MANIFEST: ${{ github.workspace }}/${{ needs.resolve-provider.outputs.manifest_path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path(os.environ['GITOPS_MANIFEST']).read_text())
          infrastructure = manifest['spec']['infrastructure']
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'iac_modules'
          contract = infrastructure['resource_contract']
          resources = root / contract['path']
          workdir = root / contract['workdir']
          if not resources.is_file():
              raise SystemExit(f'missing declared resource contract: {resources}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"resources={resources}\nworkdir={workdir}\nrenderer={root / contract['renderer']}\n")
          PY
      - name: Login to Vault with GitHub OIDC
        id: vault_login
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ vars.VAULT_VPS_JWT_ROLE }}
          jwtGithubAudience: vault
          exportToken: true
      - name: Load VPS provider credential from Vault
        id: vps_vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          path: jwt
          role: ${{ vars.VAULT_VPS_JWT_ROLE }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/${{ needs.resolve-provider.outputs.environment }}/ai-aggregator/gateway/vps VULTR_API_KEY | VULTR_API_KEY
      - name: Render and provision the selected VPS resources
        env:
          VULTR_API_KEY: ${{ steps.vps_vault.outputs.VULTR_API_KEY }}
          AI_AGGREGATOR_SSH_CIDR: ${{ vars.AI_AGGREGATOR_SSH_CIDR }}
          AI_AGGREGATOR_SOURCE_CIDR: ${{ vars.AI_AGGREGATOR_SOURCE_CIDR }}
          AI_AGGREGATOR_SSH_PUBLIC_KEY: ${{ vars.AI_AGGREGATOR_SSH_PUBLIC_KEY }}
          TARGET_DOMAIN_BASE: ${{ needs.resolve-provider.outputs.domain_base }}
        run: |
          python3 "${{ steps.contract.outputs.renderer }}" render             --resources "${{ steps.contract.outputs.resources }}"             --workdir "${{ steps.contract.outputs.workdir }}"
          terraform -chdir="${{ steps.contract.outputs.workdir }}" fmt -recursive
          terraform -chdir="${{ steps.contract.outputs.workdir }}" init -backend=false -input=false
          terraform -chdir="${{ steps.contract.outputs.workdir }}" validate
          terraform -chdir="${{ steps.contract.outputs.workdir }}" apply -auto-approve
          python3 "${{ steps.contract.outputs.renderer }}" inventory             --resources "${{ steps.contract.outputs.resources }}"             --workdir "${{ steps.contract.outputs.workdir }}"
      - name: Deploy selected VPS services
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'stage' || inputs.operation == 'activate') }}
        working-directory: playbooks
        env:
          VAULT_ADDR: https://vault.svc.plus
        run: |
          ansible-playbook -i "${{ steps.contract.outputs.workdir }}/inventory.ini" \
            deploy-ai-aggregator-v1.yml \
            -e ai_aggregator_operation=${{ inputs.operation == 'activate' && 'activate' || 'stage' }} \
            -e ai_aggregator_manifest_file=${{ github.workspace }}/${{ needs.resolve-provider.outputs.manifest_path }}
      - name: Verify selected VPS endpoints
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'stage' || inputs.operation == 'activate') }}
        env:
          AI_AGGREGATOR_MANIFEST: ${{ needs.resolve-provider.outputs.manifest_path }}
        run: ./scripts/verify_ai_aggregator_endpoints.sh
      - name: Destroy selected VPS resources
        if: ${{ always() && steps.contract.outputs.workdir != '' && inputs.destroy }}
        env:
          VULTR_API_KEY: ${{ steps.vps_vault.outputs.VULTR_API_KEY }}
        run: terraform -chdir="${{ steps.contract.outputs.workdir }}" destroy -auto-approve

  iac-resources:
    needs: [validate, resolve-provider, plan]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      needs.resolve-provider.outputs.provider == 'akamai-cloud' &&
      contains(fromJSON('["plan","apply","provision","stage","activate"]'), inputs.operation) }}
    uses: ./.github/workflows/iac-orchestrator.yml
    with:
      action: ${{ inputs.operation == 'plan' && 'plan' || 'apply' }}
      environment: ${{ needs.resolve-provider.outputs.environment }}
      cloud_provider: akamai-cloud
      target_manifest: ${{ needs.resolve-provider.outputs.iac_target_manifest }}
      account: ${{ needs.resolve-provider.outputs.account }}
      gitops_ref: ${{ needs.resolve-provider.outputs.gitops_ref }}
      iac_ref: ${{ inputs.iac_ref || 'main' }}
      stage_scope: resources
      bootstrap_mode: verify
      correlation_id: ai-aggregator-${{ github.run_id }}-${{ github.run_attempt }}
      resource_mode: ${{ inputs.resource_mode }}
    secrets: inherit

  akamai-deploy:
    needs: [validate, resolve-provider, plan, iac-resources]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
      needs.resolve-provider.outputs.provider == 'akamai-cloud' &&
      contains(fromJSON('["stage","activate"]'), inputs.operation) &&
      needs.iac-resources.outputs.result == 'applied_verified' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-provider.outputs.environment }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ needs.resolve-provider.outputs.gitops_ref }}
          path: gitops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ needs.iac-resources.outputs.iac_sha }}
          path: iac_modules
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts/pipeline
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ needs.resolve-provider.outputs.playbooks_sha }}
          path: playbooks
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned deployment controller dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 Jinja2==3.1.6 ansible-core==2.17.13
      - name: Download the exact same-run IaC summary artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.iac-resources.outputs.inventory_artifact_id }}
          path: ${{ runner.temp }}/ai-aggregator-iac-summary
      - name: Verify IaC summary against the current run and selected target
        uses: ./iac_modules/.github/actions/iac-receipt-verify
        with:
          summary-file: ${{ runner.temp }}/ai-aggregator-iac-summary/summary.json
          receipt-sha256: ${{ needs.iac-resources.outputs.receipt_sha256 }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          gitops-sha: ${{ needs.iac-resources.outputs.gitops_sha }}
          iac-sha: ${{ needs.iac-resources.outputs.iac_sha }}
          target-manifest: ${{ needs.resolve-provider.outputs.iac_target_manifest }}
          action: apply
          correlation-id: ai-aggregator-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Render the caller CMDB from verified IaC facts
        uses: ./iac_modules/.github/actions/iac-caller-inventory
        with:
          summary-file: ${{ runner.temp }}/ai-aggregator-iac-summary/summary.json
          output-dir: ${{ runner.temp }}/ai-aggregator-cmdb
      - name: Checksum the selected runtime CMDB
        id: cmdb
        env:
          CMDB_FILE: ${{ runner.temp }}/ai-aggregator-cmdb/cmdb.json
        run: echo "sha256=$(sha256sum "$CMDB_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Load Akamai read identity for provider-attested SSH host key
        id: akamai_vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ needs.resolve-provider.outputs.environment == 'prod' && 'prod-akamai-iac' || format('github-actions-platform-ops-toolkit-{0}-akamai-oidc-bootstrap-{1}', needs.resolve-provider.outputs.environment, needs.resolve-provider.outputs.account) }}
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            kv/data/CICD/${{ needs.resolve-provider.outputs.environment }}/akamai-cloud/${{ needs.resolve-provider.outputs.account }} LINODE_TOKEN | LINODE_TOKEN
      - name: Attest the host key against Akamai instance identity
        uses: ./iac_modules/.github/actions/akamai-candidate-hostkey
        with:
          cmdb-file: ${{ runner.temp }}/ai-aggregator-cmdb/cmdb.json
          cmdb-sha256: ${{ steps.cmdb.outputs.sha256 }}
          account: ${{ needs.resolve-provider.outputs.account }}
          node: ${{ needs.resolve-provider.outputs.target_hostname }}
          output-dir: ${{ runner.temp }}/ai-aggregator-hostkey
        env:
          LINODE_TOKEN: ${{ steps.akamai_vault.outputs.LINODE_TOKEN }}
      - name: Load environment deployment identity from Vault
        id: deploy_vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ vars.VAULT_JWT_ROLE }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/CICD/${{ needs.resolve-provider.outputs.environment }} SSH_PRIVATE_DEPLOY_KEY_B64 | AI_AGGREGATOR_SSH_KEY_B64
      - name: Prepare the runner-local deployment key
        id: ssh_key
        uses: ./playbooks/.github/actions/setup-deployment-runner
        with:
          ssh_key_b64: ${{ steps.deploy_vault.outputs.AI_AGGREGATOR_SSH_KEY_B64 }}
          wait_for_ssh: 'false'
          wait_for_package_init: 'false'
          install_ansible: 'false'
          assert_ansible_target: 'false'
      - name: Build the owner handoff config
        id: handoff
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ needs.resolve-provider.outputs.environment }}
          HOSTNAME: ${{ needs.resolve-provider.outputs.target_hostname }}
          DOMAIN: ${{ needs.resolve-provider.outputs.target_domain }}
          GITOPS_SHA: ${{ needs.iac-resources.outputs.gitops_sha }}
          IAC_SHA: ${{ needs.iac-resources.outputs.iac_sha }}
          PLAYBOOKS_SHA: ${{ needs.resolve-provider.outputs.playbooks_sha }}
          TARGET_MANIFEST: ${{ needs.resolve-provider.outputs.iac_target_manifest }}
          CORRELATION_ID: ai-aggregator-${{ github.run_id }}-${{ github.run_attempt }}
          SUMMARY_SHA256: ${{ needs.iac-resources.outputs.receipt_sha256 }}
          SUMMARY_FILE: ${{ runner.temp }}/ai-aggregator-iac-summary/summary.json
          CMDB_FILE: ${{ runner.temp }}/ai-aggregator-cmdb/cmdb.json
          SSH_PRIVATE_KEY: ${{ steps.ssh_key.outputs.deploy_key_file }}
          KNOWN_HOSTS: ${{ runner.temp }}/ai-aggregator-hostkey/known_hosts
          GITOPS_ROOT: ${{ github.workspace }}/gitops
          IAC_ROOT: ${{ github.workspace }}/iac_modules
          SERVICE_MANIFEST: ${{ needs.resolve-provider.outputs.service_manifest }}
          APISIX_BUNDLE_DIR: ${{ runner.temp }}/ai-aggregator-apisix-bundle
        run: |
          set -euo pipefail
          config="$(jq -cn             --arg operation "$OPERATION" --arg environment "$ENVIRONMENT"             --arg hostname "$HOSTNAME" --arg domain "$DOMAIN"             --arg gitops_root "$GITOPS_ROOT" --arg gitops_sha "$GITOPS_SHA"             --arg service_manifest "$SERVICE_MANIFEST" --arg iac_root "$IAC_ROOT"             --arg iac_sha "$IAC_SHA" --arg playbooks_sha "$PLAYBOOKS_SHA"             --arg target_manifest "$TARGET_MANIFEST" --arg correlation_id "$CORRELATION_ID"             --arg summary_file "$SUMMARY_FILE" --arg summary_sha256 "$SUMMARY_SHA256"             --arg cmdb_file "$CMDB_FILE" --arg ssh_private_key "$SSH_PRIVATE_KEY"             --arg known_hosts "$KNOWN_HOSTS" --arg apisix_bundle_dir "$APISIX_BUNDLE_DIR"             '{operation:$operation,environment:$environment,hostname:$hostname,domain:$domain,
              gitops_root:$gitops_root,gitops_sha:$gitops_sha,service_manifest:$service_manifest,
              iac_root:$iac_root,iac_sha:$iac_sha,playbooks_sha:$playbooks_sha,
              target_manifest:$target_manifest,correlation_id:$correlation_id,
              summary_file:$summary_file,summary_sha256:$summary_sha256,cmdb_file:$cmdb_file,
              ssh_private_key:$ssh_private_key,known_hosts:$known_hosts,apisix_bundle_dir:$apisix_bundle_dir}')"
          echo "config=$config" >> "$GITHUB_OUTPUT"
      - name: Deploy the selected GitOps AI Aggregator host through Playbooks owner
        uses: ./playbooks/.github/actions/ai-aggregator-deploy
        with:
          config-json: ${{ steps.handoff.outputs.config }}
          receipt-file: ${{ runner.temp }}/ai-aggregator-playbooks-receipt.json
      - name: Upload Playbooks owner receipt
        uses: actions/upload-artifact@v4
        with:
          name: ai-aggregator-playbooks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-aggregator-playbooks-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove runner-local deployment key
        if: ${{ always() }}
        env:
          DEPLOY_KEY: ${{ steps.ssh_key.outputs.deploy_key_file }}
        run: test -z "$DEPLOY_KEY" || rm -f -- "$DEPLOY_KEY"
