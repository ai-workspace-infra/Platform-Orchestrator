name: Dev feature caller contract
on:
  pull_request:
    paths:
      - '.github/actions/dev-feature-resolve/**'
      - '.github/workflows/dev-feature-deploy.yml'
      - '.github/workflows/dev-feature-resolve-contract.yml'
      - 'scripts/ci/tests/test_dev_feature_resolve.py'
      - 'scripts/ci/tests/fixtures/dev-feature-foundation/**'
      - 'scripts/vault/**'
      - 'scripts/create_vault_service_repo_roles.sh'
      - 'scripts/tests/test_akamai_dev_oidc_contract.py'
      - 'docs/dev-feature-vault-delta.json'
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITOPS_ROOT: ${{ github.workspace }}/contract/gitops-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/platform-ops-toolkit
          ref: b5ba0199eda8db773bdd1d85966155079a15adaf
          path: trusted-evidence
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: contract/gitops-vault
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Materialize ephemeral Vault contract fixtures
        env:
          GITOPS_ROOT: ${{ github.workspace }}/contract/gitops-vault
        run: python scripts/vault/vault_declarations.py materialize-test-fixtures
      - run: python -m unittest discover -s scripts/ci/tests -p test_dev_feature_resolve.py
      - run: python -m unittest discover -s scripts/tests -p test_akamai_dev_oidc_contract.py
      - run: python scripts/ci/workflow_gating_verify.py
      - run: python scripts/ci/workflow_stage_depth_verify.py
      - run: python scripts/ci/script_ownership_verify.py
      - name: Qualify actual CI integration read-only evidence access
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ROOT: ${{ github.workspace }}/trusted-evidence
          DEV_SIT_PROVENANCE_RUN: ${{ vars.DEV_SIT_PROVENANCE_RUN }}
          DEV_SIT_PROVENANCE_ARTIFACT: ${{ vars.DEV_SIT_PROVENANCE_ARTIFACT }}
          DEV_SIT_QUALIFY_PR: ${{ vars.DEV_SIT_QUALIFY_PR }}
          DEV_SIT_FOUNDATION_RUN: ${{ vars.DEV_SIT_FOUNDATION_RUN }}
          DEV_SIT_SUMMARY_ARTIFACT: ${{ vars.DEV_SIT_SUMMARY_ARTIFACT }}
          DEV_SIT_BOOTSTRAP_ARTIFACT: ${{ vars.DEV_SIT_BOOTSTRAP_ARTIFACT }}
        run: python .github/actions/dev-feature-resolve/qualify.py
