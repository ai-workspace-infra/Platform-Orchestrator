# workflow-meta:
#   purpose: immutable-uat-candidate
#   execution-path: gitops-declaration, owner-actions
#   production-promotion: separate-authorized-flow
name: Daily Main Snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/daily-main-snapshot.yaml
      - .github/actions/resolve-daily-candidate/**
      - .github/actions/candidate-gate/**
      - .github/actions/dispatch-uat-owner/**
      - .github/actions/daily-candidate-summary/**
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: 基础仓库来源；留空使用 main，并在本次运行固定为 commit SHA。
        required: false
        default: main
        type: string
      delivery_scope:
        description: GitOps 声明的构建和交付范围。
        required: true
        default: web-saas
        type: string
      snapshot_tag:
        description: 可选的全新 daily-build-* UAT 候选编号；留空自动分配不可复用的 rN。
        required: false
        default: ""
        type: string
      deploy_after_build:
        description: 构建门禁通过后，是否按 GitOps 声明显式派发 UAT owner。
        required: false
        default: false
        type: boolean
      target_ref:
        description: 显式 UAT GitOps 目标标识；deploy_after_build=true 时必须与声明一致。
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: daily-main-snapshot-${{ inputs.delivery_scope || 'web-saas' }}
  cancel-in-progress: false

jobs:
  resolve-snapshot-tag:
    name: "[1/5] Prepare | declaration and SHAs"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      candidate_id: ${{ steps.resolve.outputs.candidate_id }}
      component_matrix: ${{ steps.resolve.outputs.component_matrix }}
      gitops_sha: ${{ steps.resolve.outputs.gitops_sha }}
      artifacts_sha: ${{ steps.resolve.outputs.artifacts_sha }}
      iac_sha: ${{ steps.resolve.outputs.iac_sha }}
      playbooks_sha: ${{ steps.resolve.outputs.playbooks_sha }}
      uat_dispatch: ${{ steps.resolve.outputs.uat_dispatch }}
      uat_owner: ${{ steps.resolve.outputs.uat_owner }}
      uat_repository: ${{ steps.resolve.outputs.uat_repository }}
    steps:
      - name: Check out Orchestrator control plane
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Load the repository-scoped GitHub App identity
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-uat
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Mint a read-only token for the four base repositories
        id: infra-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DAILY_SNAPSHOT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra
          repositories: |
            gitops
            artifacts
            iac_modules
            playbooks
          permission-contents: read

      - name: Check out the selected GitOps declaration
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.source_ref || 'main' }}
          path: gitops
          token: ${{ steps.infra-token.outputs.token }}
          persist-credentials: false

      - name: Check out the Artifacts owner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ai-workspace-infra/artifacts
          ref: ${{ inputs.source_ref || 'main' }}
          path: artifacts
          token: ${{ steps.infra-token.outputs.token }}
          persist-credentials: false

      - name: Check out the IaC owner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ inputs.source_ref || 'main' }}
          path: iac_modules
          token: ${{ steps.infra-token.outputs.token }}
          persist-credentials: false

      - name: Check out the Playbooks owner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.source_ref || 'main' }}
          path: playbooks
          token: ${{ steps.infra-token.outputs.token }}
          persist-credentials: false

      - name: Resolve the reviewed component repository scope
        id: declaration
        uses: ./.github/actions/resolve-daily-candidate
        with:
          mode: declaration
          gitops-root: ${{ github.workspace }}/gitops
          artifacts-root: ${{ github.workspace }}/artifacts
          iac-root: ${{ github.workspace }}/iac_modules
          playbooks-root: ${{ github.workspace }}/playbooks
          policy-path: delivery/candidates/${{ inputs.delivery_scope || 'web-saas' }}-uat.yaml
          source-ref: ${{ inputs.source_ref || 'main' }}
          delivery-scope: ${{ inputs.delivery_scope || 'web-saas' }}
          snapshot-tag: ${{ inputs.snapshot_tag || '' }}
          deploy-after-build: ${{ inputs.deploy_after_build || false }}
          target-ref: ${{ inputs.target_ref || '' }}

      - name: Mint a read-only token for the declared component repositories
        id: component-read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DAILY_SNAPSHOT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ${{ steps.declaration.outputs.component_owner }}
          repositories: ${{ steps.declaration.outputs.component_repositories }}
          permission-contents: read

      - name: Resolve immutable SHAs, component matrix and candidate ID
        id: resolve
        uses: ./.github/actions/resolve-daily-candidate
        with:
          mode: resolve
          gitops-root: ${{ github.workspace }}/gitops
          artifacts-root: ${{ github.workspace }}/artifacts
          iac-root: ${{ github.workspace }}/iac_modules
          playbooks-root: ${{ github.workspace }}/playbooks
          policy-path: delivery/candidates/${{ inputs.delivery_scope || 'web-saas' }}-uat.yaml
          source-ref: ${{ inputs.source_ref || 'main' }}
          delivery-scope: ${{ inputs.delivery_scope || 'web-saas' }}
          snapshot-tag: ${{ inputs.snapshot_tag || '' }}
          deploy-after-build: ${{ inputs.deploy_after_build || false }}
          target-ref: ${{ inputs.target_ref || '' }}
          github-token: ${{ steps.component-read-token.outputs.token }}

  snapshot:
    name: "[2/5] Build | ${{ matrix.name }}"
    needs: resolve-snapshot-tag
    if: ${{ needs.resolve-snapshot-tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-snapshot-tag.outputs.component_matrix) }}
    steps:
      - name: Load build and registry identities
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-uat
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY ;
            kv/data/CICD GHCR_USERNAME | GHCR_USERNAME ;
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN

      - name: Mint a read-only Artifacts owner token
        id: artifacts-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DAILY_SNAPSHOT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra
          repositories: artifacts
          permission-contents: read

      - name: Mint a token for the exact component repository
        id: component-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DAILY_SNAPSHOT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ${{ matrix.component.source_owner }}
          repositories: ${{ matrix.component.source_repository_name }}
          permission-actions: write
          permission-contents: write

      - name: Check out the fixed Artifacts owner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ai-workspace-infra/artifacts
          ref: ${{ needs.resolve-snapshot-tag.outputs.artifacts_sha }}
          path: artifacts
          token: ${{ steps.artifacts-token.outputs.token }}
          persist-credentials: false

      - name: Publish and verify the component candidate
        id: component
        uses: ./artifacts/.github/actions/component-candidate
        with:
          component-json: ${{ toJSON(matrix.component) }}
          candidate-id: ${{ needs.resolve-snapshot-tag.outputs.candidate_id }}
          source-ref: ${{ inputs.source_ref || 'main' }}
          owner-sha: ${{ needs.resolve-snapshot-tag.outputs.artifacts_sha }}
          github-token: ${{ steps.component-token.outputs.token }}
          registry-username: ${{ steps.vault.outputs.GHCR_USERNAME }}
          registry-token: ${{ steps.vault.outputs.GHCR_TOKEN }}

      - name: Preserve the component receipt
        if: ${{ always() && steps.component.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-component-${{ matrix.name }}
          path: ${{ steps.component.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 30

  snapshot-gate:
    name: "[3/5] Gate | immutable candidate"
    needs: [resolve-snapshot-tag, snapshot]
    if: ${{ always() && needs.resolve-snapshot-tag.result == 'success' && needs.snapshot.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      candidate_fingerprint: ${{ steps.gate.outputs.fingerprint }}
    steps:
      - name: Check out Orchestrator candidate gate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download component receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: candidate-component-*
          path: ${{ runner.temp }}/candidate-component-receipts

      - name: Validate coverage, provenance and immutable artifacts
        id: gate
        uses: ./.github/actions/candidate-gate
        with:
          receipts-directory: ${{ runner.temp }}/candidate-component-receipts
          component-matrix: ${{ needs.resolve-snapshot-tag.outputs.component_matrix }}
          candidate-id: ${{ needs.resolve-snapshot-tag.outputs.candidate_id }}
          delivery-scope: ${{ inputs.delivery_scope || 'web-saas' }}
          gitops-sha: ${{ needs.resolve-snapshot-tag.outputs.gitops_sha }}
          artifacts-sha: ${{ needs.resolve-snapshot-tag.outputs.artifacts_sha }}
          iac-sha: ${{ needs.resolve-snapshot-tag.outputs.iac_sha }}
          playbooks-sha: ${{ needs.resolve-snapshot-tag.outputs.playbooks_sha }}

      - name: Preserve the fixed candidate manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-candidate-manifest
          path: ${{ steps.gate.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 90

  dispatch-environment:
    name: "[4/5] Dispatch | explicit UAT owner"
    needs: [resolve-snapshot-tag, snapshot-gate]
    if: >-
      ${{
        always() &&
        needs.resolve-snapshot-tag.result == 'success' &&
        needs.snapshot-gate.result == 'success' &&
        inputs.deploy_after_build == true
      }}
    runs-on: ubuntu-latest
    environment: uat
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out Orchestrator dispatch control
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download the fixed candidate manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: daily-candidate-manifest
          path: ${{ runner.temp }}/daily-candidate-manifest

      - name: Load the repository-scoped GitHub App identity
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-uat
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Mint a token for the declared UAT owner
        id: uat-owner-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DAILY_SNAPSHOT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ${{ needs.resolve-snapshot-tag.outputs.uat_owner }}
          repositories: ${{ needs.resolve-snapshot-tag.outputs.uat_repository }}
          permission-actions: write
          permission-contents: write

      - name: Dispatch and validate the declared UAT owner
        id: dispatch
        uses: ./.github/actions/dispatch-uat-owner
        with:
          dispatch-json: ${{ needs.resolve-snapshot-tag.outputs.uat_dispatch }}
          candidate-manifest: ${{ runner.temp }}/daily-candidate-manifest/candidate-manifest.json
          candidate-fingerprint: ${{ needs.snapshot-gate.outputs.candidate_fingerprint }}
          github-token: ${{ steps.uat-owner-token.outputs.token }}

      - name: Preserve the validated UAT owner receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-candidate-uat-receipt
          path: ${{ steps.dispatch.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 90

  snapshot-summary:
    name: "[5/5] Summary | actual receipts"
    needs: [resolve-snapshot-tag, snapshot, snapshot-gate, dispatch-environment]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Orchestrator summary control
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Publish and enforce the final status
        uses: ./.github/actions/daily-candidate-summary
        with:
          candidate-id: ${{ needs.resolve-snapshot-tag.outputs.candidate_id }}
          candidate-fingerprint: ${{ needs.snapshot-gate.outputs.candidate_fingerprint }}
          deploy-requested: ${{ inputs.deploy_after_build || false }}
          prepare-result: ${{ needs.resolve-snapshot-tag.result }}
          build-result: ${{ needs.snapshot.result }}
          gate-result: ${{ needs.snapshot-gate.result }}
          dispatch-result: ${{ needs.dispatch-environment.result }}
