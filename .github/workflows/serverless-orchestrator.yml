name: Serverless Orchestrator

# Resolve → IaC/Provision → Deploy → Migrate/Configure → Verify
# Local reusable stages preserve github.run_id/run_attempt and owner receipts.

permissions:
  id-token: write
  contents: read
  # Read the UAT Hybrid run a PROD promotion manifest names.
  actions: write

on:
  workflow_dispatch:
    inputs:
      operation:
        description: '执行范围：plan 校验；init-schema 初始化；deploy/upgrade 部署；migrate 数据迁移；deploy+migrate 部署+迁移；repair-schema 仅修复已审阅 r3 UAT schema（不部署、不切 DNS）；destroy 销毁（Prod 禁止）'
        required: true
        default: 'deploy'
        type: choice
        options:
          - plan
          - init-schema
          - deploy
          - upgrade
          - migrate
          - deploy+migrate
          - repair-schema
          - destroy
      target_domains:
        description: '选择要执行的业务域 (Business Domain)。serverless 仅部署 web-saas；默认 all 在 serverless 中解析为 web-saas，其它业务域走 cloud_provider 环境副本链路。'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ai-workspace
          - web-saas
          - infra-platform
          - agent-proxy
          - web-saas + agent-proxy
      cloud_provider:
        description: '混合环境关联的云服务商；serverless 运行时仍由 Cloud Run/Cloudflare 承载，资源创建由对应 IaC workflow 负责'
        required: false
        default: 'gcp-cloud'
        type: choice
        options:
          - aws-cloud
          - gcp-cloud
          - azure-cloud
          - vultr-vps
          - akamai-cloud
          - ucloud
      vault_env_path:
        description: 'Target environment'
        required: false
        default: 'uat'
        type: choice
        options:
          - sit
          - uat
          - prod
      tag_ref:
        description: 'Unified immutable tag for Cloud Run images, portal, and edge-gateway (for example daily-build-2026.08.17-r1)'
        required: false
        type: string
      website_content_ref:
        description: 'Reviewed knowledge commit or immutable tag consumed by Portal website builds'
        required: false
        default: 'main'
        type: string
      accounts_schema_ref:
        description: 'Accounts source ref containing sql/schema.sql; used only by init-schema'
        required: false
        default: 'main'
        type: string
      apply_accounts_schema_migration:
        description: 'UAT only: apply one reviewed Accounts sql/migrations change before Cloud Run deployment'
        required: false
        default: false
        type: boolean
      adopt_accounts_baseline:
        description: 'UAT only: adopt the reviewed expand-only Accounts baseline before Cloud Run deployment'
        required: false
        default: false
        type: boolean
      accounts_schema_expected_version:
        description: 'UAT current schema_migrations version before applying the change'
        required: false
        type: string
      accounts_schema_target_version:
        description: 'Target version of the one Accounts .up.sql migration'
        required: false
        type: string
      accounts_schema_sha256:
        description: 'Expected SHA-256 of the target Accounts .up.sql migration'
        required: false
        type: string
      probe_accounts_schema:
        description: 'UAT plan only: inspect schema_migrations version and lifecycle readiness without changes'
        required: false
        default: false
        type: boolean
      deploy_cloudflare:
        description: 'Deploy Cloudflare SSR Workers, edge gateway, and Pages static assets'
        required: false
        default: true
        type: boolean
      deploy_cloud_run:
        description: 'Deploy backend services to GCP Cloud Run'
        required: false
        default: true
        type: boolean
      cloud_run_service:
        description: 'Optional single Cloud Run service to deploy; empty deploys the backend service set'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - accounts
          - content-service
          - billing-service
      skip_stripe_catalog:
        description: 'Skip optional Stripe catalog synchronization without blocking core deployment'
        required: false
        default: false
        type: boolean
      dns_mode:
        description: 'DNS 行为：none 不发布；uat-records 更新 SIT/UAT canonical；prod-cutover 接管生产 canonical（普通部署不会改 canonical）'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - uat-records
          - prod-cutover
      accounts_source_backend:
        description: '仅 migrate/deploy+migrate：Accounts 数据迁移源端：supabase（PROD Supabase 云直连）或 vps（传统 VPS 容器 SSH）'
        required: false
        default: 'supabase'
        type: choice
        options:
          - supabase
          - vps
      supabase_source_tunnel_host:
        description: '仅 migrate/deploy+migrate (vps 源)：PROD 源 PostgreSQL SSH 主机；在 postgresql-svc-plus 容器内执行只读导出'
        required: false
        default: 'console.svc.plus'
        type: string
      supabase_target_existing_strategy:
        description: 'Legacy compatibility input; explicit import uses unified entry, never replace_public'
        required: false
        # No ordinary deployment refreshes UAT from production.
        default: 'accounts_merge'
        type: choice
        options: [reject, accounts_merge]
      supabase_target_confirm_replace:
        description: 'Retired destructive compatibility flag; ignored, replacement remains disabled'
        required: false
        default: false
        type: boolean
      runner_type:
        description: '迁移这一段跑在哪种 Runner 上（ubuntu-latest 或 self-hosted）'
        required: false
        default: 'ubuntu-latest'
        type: string
      promotion_manifest:
        description: '仅 PROD：Daily 校验过的 UAT 制品清单（JSON）。PROD Cloud Run 按 digest 晋级，不从源码重建'
        required: false
        default: ''
        type: string

concurrency:
  group: serverless-${{ inputs.vault_env_path || 'uat' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: '[1/5] Resolve & Validate'
    uses: ./.github/workflows/serverless-stage-resolve.yml
    with:
      operation: ${{ inputs.operation }}
      target_domains: ${{ inputs.target_domains }}
      cloud_provider: ${{ inputs.cloud_provider }}
      vault_env_path: ${{ inputs.vault_env_path }}
      tag_ref: ${{ inputs.tag_ref }}
      apply_accounts_schema_migration: ${{ inputs.apply_accounts_schema_migration }}
      adopt_accounts_baseline: ${{ inputs.adopt_accounts_baseline }}
      accounts_schema_expected_version: ${{ inputs.accounts_schema_expected_version }}
      accounts_schema_target_version: ${{ inputs.accounts_schema_target_version }}
      accounts_schema_sha256: ${{ inputs.accounts_schema_sha256 }}
      probe_accounts_schema: ${{ inputs.probe_accounts_schema }}
      deploy_cloudflare: ${{ inputs.deploy_cloudflare }}
      deploy_cloud_run: ${{ inputs.deploy_cloud_run }}
      dns_mode: ${{ inputs.dns_mode }}
      promotion_manifest: ${{ inputs.promotion_manifest }}
  infrastructure:
    name: '[2/5] IaC & Provision'
    needs:
    - resolve
    uses: ./.github/workflows/serverless-stage-infra.yml
    with:
      operation: ${{ inputs.operation }}
      vault_env_path: ${{ inputs.vault_env_path }}
      resolve_context: ${{ needs.resolve.outputs.context || '{}' }}
  deploy:
    name: '[3/5] Deploy'
    needs:
    - resolve
    - infrastructure
    uses: ./.github/workflows/serverless-stage-deploy.yml
    with:
      operation: ${{ inputs.operation }}
      vault_env_path: ${{ inputs.vault_env_path }}
      tag_ref: ${{ inputs.tag_ref }}
      website_content_ref: ${{ inputs.website_content_ref }}
      apply_accounts_schema_migration: ${{ inputs.apply_accounts_schema_migration }}
      adopt_accounts_baseline: ${{ inputs.adopt_accounts_baseline }}
      accounts_schema_expected_version: ${{ inputs.accounts_schema_expected_version }}
      accounts_schema_target_version: ${{ inputs.accounts_schema_target_version }}
      accounts_schema_sha256: ${{ inputs.accounts_schema_sha256 }}
      probe_accounts_schema: ${{ inputs.probe_accounts_schema }}
      deploy_cloudflare: ${{ inputs.deploy_cloudflare }}
      deploy_cloud_run: ${{ inputs.deploy_cloud_run }}
      cloud_run_service: ${{ inputs.cloud_run_service }}
      dns_mode: ${{ inputs.dns_mode }}
      promotion_manifest: ${{ inputs.promotion_manifest }}
      resolve_context: ${{ needs.resolve.outputs.context || '{}' }}
      infra_context: ${{ needs.infrastructure.outputs.context || '{}' }}
  migrate:
    name: '[4/5] Migrate & Configure'
    needs:
    - resolve
    - infrastructure
    - deploy
    uses: ./.github/workflows/serverless-stage-migrate.yml
    with:
      operation: ${{ inputs.operation }}
      vault_env_path: ${{ inputs.vault_env_path }}
      tag_ref: ${{ inputs.tag_ref }}
      apply_accounts_schema_migration: ${{ inputs.apply_accounts_schema_migration }}
      adopt_accounts_baseline: ${{ inputs.adopt_accounts_baseline }}
      deploy_cloudflare: ${{ inputs.deploy_cloudflare }}
      deploy_cloud_run: ${{ inputs.deploy_cloud_run }}
      skip_stripe_catalog: ${{ inputs.skip_stripe_catalog }}
      resolve_context: ${{ needs.resolve.outputs.context || '{}' }}
      deploy_context: ${{ needs.deploy.outputs.context || '{}' }}
  verify:
    name: '[5/5] Verify & Report'
    needs:
    - resolve
    - infrastructure
    - deploy
    - migrate
    if: ${{ always() && needs.resolve.result != '' && needs.infrastructure.result != '' && needs.deploy.result != '' && needs.migrate.result != '' }}
    uses: ./.github/workflows/serverless-stage-verify.yml
    with:
      operation: ${{ inputs.operation }}
      target_domains: ${{ inputs.target_domains }}
      vault_env_path: ${{ inputs.vault_env_path }}
      tag_ref: ${{ inputs.tag_ref }}
      apply_accounts_schema_migration: ${{ inputs.apply_accounts_schema_migration }}
      adopt_accounts_baseline: ${{ inputs.adopt_accounts_baseline }}
      deploy_cloudflare: ${{ inputs.deploy_cloudflare }}
      deploy_cloud_run: ${{ inputs.deploy_cloud_run }}
      cloud_run_service: ${{ inputs.cloud_run_service }}
      dns_mode: ${{ inputs.dns_mode }}
      resolve_context: ${{ needs.resolve.outputs.context || '{}' }}
      infra_context: ${{ needs.infrastructure.outputs.context || '{}' }}
      deploy_context: ${{ needs.deploy.outputs.context || '{}' }}
      migrate_context: ${{ needs.migrate.outputs.context || '{}' }}
      stage_results: ${{ toJSON(needs) }}
