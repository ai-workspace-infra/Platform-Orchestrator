# workflow-meta:
#   purpose: orchestrate
#   execution-path: reusable-owner-workflows
#   flux-reconciliation: no
name: Serverless Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment: {required: true, default: uat, type: choice, options: [uat, prod]}
      operation: {required: true, default: deploy, type: choice, options: [plan, init, deploy, upgrade, migrate, deploy+migrate]}
      release_tag: {required: false, default: '', type: string}
      promotion_manifest: {required: false, default: '', type: string}
      dns_mode: {required: false, default: none, type: choice, options: [none, uat-records, prod-cutover]}
      migration_mode: {required: false, default: checkpoint, type: choice, options: [checkpoint, probe, migrate, baseline]}
      expected_schema_version: {required: false, default: '', type: string}
      target_schema_version: {required: false, default: '', type: string}
      migration_sha256: {required: false, default: '', type: string}
  workflow_call:
    inputs:
      environment: {required: true, default: uat, type: string}
      operation: {required: true, default: deploy, type: string}
      release_tag: {required: false, default: '', type: string}
      promotion_manifest: {required: false, default: '', type: string}
      dns_mode: {required: false, default: none, type: string}
      migration_mode: {required: false, default: checkpoint, type: string}
      expected_schema_version: {required: false, default: '', type: string}
      target_schema_version: {required: false, default: '', type: string}
      migration_sha256: {required: false, default: '', type: string}
    outputs:
      delivery_receipt:
        description: Final owner receipt summary
        value: ${{ jobs.summary.outputs.context }}

permissions: {id-token: write, contents: read, actions: write}
concurrency:
  group: serverless-${{ inputs.environment || 'uat' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: '[1/5] Resolve and validate'
    uses: ./.github/workflows/serverless-stage-resolve.yml
    with:
      vault_env_path: ${{ inputs.environment || 'uat' }}
      operation: ${{ inputs.operation || 'deploy' }}
      tag_ref: ${{ inputs.release_tag || '' }}
      promotion_manifest: ${{ inputs.promotion_manifest || '' }}
      dns_mode: ${{ inputs.dns_mode || 'none' }}
    secrets: inherit

  infra:
    name: '[2/5] IaC owner: provision and facts'
    needs: resolve
    if: ${{ always() && needs.resolve.result == 'success' }}
    uses: ./.github/workflows/serverless-stage-infra.yml
    with:
      operation: ${{ inputs.operation || 'deploy' }}
      vault_env_path: ${{ inputs.environment || 'uat' }}
      resolve_context: ${{ needs.resolve.outputs.context }}
    secrets: inherit

  deploy:
    name: '[3/5] Service owners: deploy'
    needs: [resolve, infra]
    if: ${{ always() && needs.resolve.result == 'success' && needs.infra.result == 'success' }}
    uses: ./.github/workflows/serverless-stage-deploy.yml
    with:
      operation: ${{ inputs.operation || 'deploy' }}
      vault_env_path: ${{ inputs.environment || 'uat' }}
      tag_ref: ${{ inputs.release_tag || '' }}
      dns_mode: ${{ inputs.dns_mode || 'none' }}
      resolve_context: ${{ needs.resolve.outputs.context }}
      infra_context: ${{ needs.infra.outputs.context }}
    secrets: inherit

  migrate:
    name: '[4/5] Playbooks owner: migrate and configure'
    needs: [resolve, infra, deploy]
    if: ${{ always() && needs.resolve.result == 'success' && needs.infra.result == 'success' && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/serverless-stage-migrate.yml
    with:
      operation: ${{ inputs.operation || 'deploy' }}
      vault_env_path: ${{ inputs.environment || 'uat' }}
      tag_ref: ${{ inputs.release_tag || '' }}
      deploy_cloudflare: true
      deploy_cloud_run: true
      skip_stripe_catalog: true
      resolve_context: ${{ needs.resolve.outputs.context }}
      deploy_context: ${{ needs.deploy.outputs.context }}
    secrets: inherit

  summary:
    name: '[5/5] Verify and publish owner receipts'
    needs: [resolve, infra, deploy, migrate]
    if: ${{ always() && needs.resolve.result != '' && needs.infra.result != '' && needs.deploy.result != '' && needs.migrate.result != '' }}
    uses: ./.github/workflows/serverless-stage-verify.yml
    with:
      operation: ${{ inputs.operation || 'deploy' }}
      delivery_scope: web-saas
      vault_env_path: ${{ inputs.environment || 'uat' }}
      tag_ref: ${{ inputs.release_tag || '' }}
      dns_mode: ${{ inputs.dns_mode || 'none' }}
      deploy_cloudflare: true
      deploy_cloud_run: true
      resolve_context: ${{ needs.resolve.outputs.context }}
      infra_context: ${{ needs.infra.outputs.context }}
      deploy_context: ${{ needs.deploy.outputs.context }}
      migrate_context: ${{ needs.migrate.outputs.context }}
      stage_results: ${{ toJSON(needs) }}
    secrets: inherit
