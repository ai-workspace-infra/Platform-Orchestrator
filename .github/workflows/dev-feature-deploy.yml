name: Dev XConnect referral deployment
run-name: 'dev-${{ inputs.operation }}:${{ inputs.phase }} / ${{ inputs.stage }} / GitOps PR${{ inputs.candidate_pr }}'
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [feature, ingress]
        default: feature
        required: true
      phase:
        type: choice
        options: [plan, prepare, seed-admin, submit, initialize, verify, enable-tls, reconcile]
        default: plan
        required: true
      stage:
        type: choice
        options: [sit, uat]
        default: sit
        required: true
      candidate_pr:
        description: Same-repository GitOps PR; actual head resolved through API
        type: number
        required: true
      prepare_run:
        description: Successful prepare run locator, required for initialize/verify
        type: number
        default: 0
      prepare_artifact:
        type: number
        default: 0
      seed_run:
        description: Successful initialize run locator, required for verify
        type: number
        default: 0
      seed_artifact:
        type: number
        default: 0
      foundation_run:
        type: number
        default: 40353330431
        required: true
      summary_artifact:
        description: Original IaC attempt1 owner bundle
        type: number
        default: 12664517641
        required: true
      bootstrap_artifact:
        description: Successful bootstrap attempt2 receipt
        type: number
        default: 12668512699
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: dev-xconnect-referral-single-target
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      instance: ${{ steps.evidence.outputs.instance-id }}
      cmdb_sha256: ${{ steps.evidence.outputs.cmdb-sha256 }}
      node_uid: ${{ steps.evidence.outputs.node-uid }}
      cluster_uid: ${{ steps.evidence.outputs.cluster-uid }}
      platform_sha: ${{ steps.evidence.outputs.platform-sha }}
      gitops_sha: ${{ steps.evidence.outputs.gitops-sha }}
      prepare_sha256: ${{ steps.evidence.outputs.prepare-sha256 }}
      seed_sha256: ${{ steps.evidence.outputs.seed-sha256 }}
      candidate_sha256: ${{ steps.evidence.outputs.candidate-sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Explicit dependency: Toolkit1454 hardened shared evidence transport.
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/platform-ops-toolkit
          ref: b5ba0199eda8db773bdd1d85966155079a15adaf
          path: trusted-evidence
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - uses: ./.github/actions/dev-feature-resolve
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: ${{ inputs.operation }}
          phase: ${{ inputs.phase }}
          prepare-run: ${{ inputs.prepare_run }}
          prepare-artifact: ${{ inputs.prepare_artifact }}
          seed-run: ${{ inputs.seed_run }}
          seed-artifact: ${{ inputs.seed_artifact }}
          candidate-pr: ${{ inputs.candidate_pr }}
          stage: ${{ inputs.stage }}
          foundation-run: ${{ inputs.foundation_run }}
          summary-artifact: ${{ inputs.summary_artifact }}
          bootstrap-artifact: ${{ inputs.bootstrap_artifact }}
          evidence-root: ${{ github.workspace }}/trusted-evidence
          destination: ${{ runner.temp }}/dev-feature-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: dev-feature-cmdb-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-feature-evidence/cmdb/cmdb.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dev-feature-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-feature-evidence/candidate/receipt.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dev-feature-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-feature-evidence/foundation.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'feature' && (inputs.phase == 'initialize' || inputs.phase == 'verify')
        with:
          name: dev-feature-prepare-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-feature-evidence/prepare/receipt.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'feature' && inputs.phase == 'verify'
        with:
          name: dev-feature-seed-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-feature-evidence/seed/receipt.json
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: resolve
    if: inputs.operation == 'feature' && inputs.phase != 'seed-admin' && inputs.phase != 'initialize'
    uses: ai-workspace-infra/playbooks/.github/workflows/dev-feature-flux.yml@f8a2aaa4252586fd9b56852d8b71ce8bedc48084
    with:
      stage: ${{ inputs.stage }}
      mode: ${{ inputs.phase }}
      prepare_artifact: dev-feature-prepare-projection-${{ github.run_id }}-${{ github.run_attempt }}
      prepare_sha256: ${{ needs.resolve.outputs.prepare_sha256 }}
      seed_artifact: dev-feature-seed-projection-${{ github.run_id }}-${{ github.run_attempt }}
      seed_sha256: ${{ needs.resolve.outputs.seed_sha256 }}
      candidate_artifact: dev-feature-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      candidate_sha256: ${{ needs.resolve.outputs.candidate_sha256 }}
      cmdb_artifact: dev-feature-cmdb-${{ github.run_id }}-${{ github.run_attempt }}
      cmdb_sha256: ${{ needs.resolve.outputs.cmdb_sha256 }}
      instance_id: ${{ needs.resolve.outputs.instance }}
      gitops_sha: ${{ needs.resolve.outputs.gitops_sha }}
      platform_sha: ${{ needs.resolve.outputs.platform_sha }}
      node_uid: ${{ needs.resolve.outputs.node_uid }}
      cluster_uid: ${{ needs.resolve.outputs.cluster_uid }}
  seed:
    needs: resolve
    if: inputs.operation == 'feature' && (inputs.phase == 'seed-admin' || inputs.phase == 'initialize')
    uses: ai-workspace-infra/playbooks/.github/workflows/dev-web-saas-seed.yml@0e10792d35dd70b9d70eff59eb064c5b84c5a22e
    with:
      stage: ${{ inputs.stage }}
      phase: ${{ inputs.phase }}
      candidate_artifact: dev-feature-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      candidate_sha256: ${{ needs.resolve.outputs.candidate_sha256 }}
      cmdb_artifact: dev-feature-cmdb-${{ github.run_id }}-${{ github.run_attempt }}
      cmdb_sha256: ${{ needs.resolve.outputs.cmdb_sha256 }}
      instance_id: ${{ needs.resolve.outputs.instance }}
      gitops_sha: ${{ needs.resolve.outputs.gitops_sha }}
      platform_sha: ${{ needs.resolve.outputs.platform_sha }}
      node_uid: ${{ needs.resolve.outputs.node_uid }}
      cluster_uid: ${{ needs.resolve.outputs.cluster_uid }}
  ingress:
    needs: resolve
    if: inputs.operation == 'ingress'
    uses: ai-workspace-infra/playbooks/.github/workflows/dev-platform-ingress.yml@f8a2aaa4252586fd9b56852d8b71ce8bedc48084
    with:
      mode: ${{ inputs.phase }}
      candidate_artifact: dev-feature-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      candidate_sha256: ${{ needs.resolve.outputs.candidate_sha256 }}
      cmdb_artifact: dev-feature-cmdb-${{ github.run_id }}-${{ github.run_attempt }}
      cmdb_sha256: ${{ needs.resolve.outputs.cmdb_sha256 }}
      instance_id: ${{ needs.resolve.outputs.instance }}
      gitops_sha: ${{ needs.resolve.outputs.gitops_sha }}
      platform_sha: ${{ needs.resolve.outputs.platform_sha }}
      node_uid: ${{ needs.resolve.outputs.node_uid }}
      cluster_uid: ${{ needs.resolve.outputs.cluster_uid }}
  report:
    needs: [resolve, deploy, seed, ingress]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly the selected owner to succeed
        env:
          OPERATION: ${{ inputs.operation }}
          PHASE: ${{ inputs.phase }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SEED_RESULT: ${{ needs.seed.result }}
          INGRESS_RESULT: ${{ needs.ingress.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RESOLVE_RESULT" = success
          case "$OPERATION:$PHASE" in
            feature:seed-admin|feature:initialize)
              test "$SEED_RESULT" = success
              test "$DEPLOY_RESULT" = skipped
              test "$INGRESS_RESULT" = skipped ;;
            feature:plan|feature:prepare|feature:submit|feature:verify|feature:enable-tls)
              test "$DEPLOY_RESULT" = success
              test "$SEED_RESULT" = skipped
              test "$INGRESS_RESULT" = skipped ;;
            ingress:plan|ingress:reconcile|ingress:verify)
              test "$INGRESS_RESULT" = success
              test "$DEPLOY_RESULT" = skipped
              test "$SEED_RESULT" = skipped ;;
            *) echo '::error::No valid fixed owner route selected'; exit 1 ;;
          esac
          echo "Selected owner completed phase $PHASE. Consult its immutable receipt for pending/Ready results. Business acceptance: NOT_RUN." >> "$GITHUB_STEP_SUMMARY"
