name: Feature lane SIT deployment and technical verification
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Feature tag preflight]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  verified-candidate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      artifact: ${{ steps.receipt.outputs.artifact }}
      sha256: ${{ steps.receipt.outputs.sha256 }}
      cmdb_artifact: ${{ steps.foundation_artifact.outputs.name }}
      cmdb_sha256: ${{ steps.foundation.outputs.cmdb_sha256 }}
      instance_id: ${{ steps.foundation.outputs.instance_id }}
      node_uid: ${{ steps.foundation.outputs.node_uid }}
      cluster_uid: ${{ steps.foundation.outputs.cluster_uid }}
      platform_sha: ${{ steps.foundation.outputs.platform_sha }}
      feature_id: ${{ steps.dns_inputs.outputs.feature_id }}
      feature_tag: ${{ steps.dns_inputs.outputs.feature_tag }}
      candidate_sha256: ${{ steps.dns_inputs.outputs.candidate_sha256 }}
      gitops_sha: ${{ steps.dns_inputs.outputs.gitops_sha }}
      console_host: ${{ steps.dns_inputs.outputs.console_host }}
      accounts_host: ${{ steps.dns_inputs.outputs.accounts_host }}
      billing_host: ${{ steps.dns_inputs.outputs.billing_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate pushed tag and reviewed Main candidate
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/feature-lane/main-event.py
      - name: Read scoped evidence App identity
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-feature-lane-deploy-evidence-read-sit
          jwtGithubAudience: vault
          exportEnv: false
          secrets: |
            kv/data/sit/platform/github-app/feature-lane app_id | FEATURE_APP_ID ;
            kv/data/sit/platform/github-app/feature-lane app_private_key | FEATURE_APP_PRIVATE_KEY
      - name: Create scoped infra evidence token
        id: infra
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ steps.vault.outputs.FEATURE_APP_ID }}
          private-key: ${{ steps.vault.outputs.FEATURE_APP_PRIVATE_KEY }}
          owner: ai-workspace-infra
          repositories: ${{ steps.event.outputs.infra_repositories }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - name: Create scoped services evidence token
        id: services
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ steps.vault.outputs.FEATURE_APP_ID }}
          private-key: ${{ steps.vault.outputs.FEATURE_APP_PRIVATE_KEY }}
          owner: ai-workspace-services
          repositories: ${{ steps.event.outputs.services_repositories }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - name: Reverify candidate and produce same-run receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_GH_TOKEN_INFRA: ${{ steps.infra.outputs.token }}
          FEATURE_GH_TOKEN_SERVICES: ${{ steps.services.outputs.token }}
          FEATURE_EVENT_TAG: ${{ steps.event.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          export FEATURE_CANDIDATE_FILE="$GITHUB_WORKSPACE/.github/feature-candidates/$FEATURE_EVENT_TAG/candidate.json"
          export FEATURE_EVIDENCE_SELECTORS_FILE="$GITHUB_WORKSPACE/.github/feature-candidates/$FEATURE_EVENT_TAG/evidence-selectors.json"
          mkdir -p "$RUNNER_TEMP/feature-candidate"
          python3 .github/scripts/feature-lane/deploy-receipt.py > "$RUNNER_TEMP/feature-candidate/receipt.json"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/feature-candidate/receipt.json" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "artifact=feature-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Derive DNS identity from verified candidate
        id: dns_inputs
        env:
          FEATURE_RECEIPT_FILE: ${{ runner.temp }}/feature-candidate/receipt.json
        run: python3 .github/scripts/feature-lane/dns-inputs.py
      - name: Install pinned foundation parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Authenticate reviewed foundation evidence
        id: foundation
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_GH_TOKEN_INFRA: ${{ steps.infra.outputs.token }}
          FEATURE_GH_TOKEN_SERVICES: ${{ steps.services.outputs.token }}
          FEATURE_RECEIPT_FILE: ${{ runner.temp }}/feature-candidate/receipt.json
        run: python3 .github/scripts/feature-lane/foundation-projection.py
      - name: Name same-run CMDB evidence
        id: foundation_artifact
        run: echo "name=feature-foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.foundation_artifact.outputs.name }}
          path: ${{ runner.temp }}/feature-foundation/cmdb.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: ${{ runner.temp }}/feature-candidate/receipt.json
          if-no-files-found: error
          retention-days: 7
  observe-target:
    needs: verified-candidate
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ai-workspace-infra/iac_modules/.github/workflows/feature-sit-target-observe.yml@61f79c73d1c415755989fa55c8a36a3b862b391d
    with:
      cmdb_artifact: ${{ needs.verified-candidate.outputs.cmdb_artifact }}
      cmdb_sha256: ${{ needs.verified-candidate.outputs.cmdb_sha256 }}
      candidate_sha256: ${{ needs.verified-candidate.outputs.sha256 }}
      instance_id: ${{ needs.verified-candidate.outputs.instance_id }}
  edge-preflight:
    needs: [verified-candidate, observe-target]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: feature-sit-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/feature-target
      - name: Check Dev ingress reachability before DNS
        env:
          TARGET_OBSERVATION: ${{ runner.temp }}/feature-target/feature-target-observation.json
          CANDIDATE_RECEIPT_SHA256: ${{ needs.verified-candidate.outputs.sha256 }}
          CMDB_SHA256: ${{ needs.verified-candidate.outputs.cmdb_sha256 }}
          INSTANCE_ID: ${{ needs.verified-candidate.outputs.instance_id }}
          CONSOLE_HOST: ${{ needs.verified-candidate.outputs.console_host }}
        run: python3 .github/scripts/feature-lane/edge-preflight.py
  publish-dns:
    needs: [verified-candidate, observe-target, edge-preflight]
    strategy:
      fail-fast: false
      matrix:
        service: [console, accounts, billing]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ai-workspace-infra/iac_modules/.github/workflows/feature-sit-dns.yml@3cfc12d95578885ecd267d7d09e049919ff10464
    with:
      candidate_artifact: ${{ needs.verified-candidate.outputs.artifact }}
      candidate_receipt_sha256: ${{ needs.verified-candidate.outputs.sha256 }}
      candidate_sha256: ${{ needs.verified-candidate.outputs.candidate_sha256 }}
      cmdb_artifact: ${{ needs.verified-candidate.outputs.cmdb_artifact }}
      cmdb_sha256: ${{ needs.verified-candidate.outputs.cmdb_sha256 }}
      gitops_sha: ${{ needs.verified-candidate.outputs.gitops_sha }}
      feature_id: ${{ needs.verified-candidate.outputs.feature_id }}
      feature_tag: ${{ needs.verified-candidate.outputs.feature_tag }}
      service: ${{ matrix.service }}
      hostname: ${{ needs.verified-candidate.outputs[format('{0}_host', matrix.service)] }}
  sit-execute:
    needs: [verified-candidate, publish-dns]
    permissions: {contents: read, actions: read, id-token: write}
    uses: ./.github/workflows/feature-sit-execute.yml
    with:
      artifact: ${{ needs.verified-candidate.outputs.artifact }}
      sha256: ${{ needs.verified-candidate.outputs.sha256 }}
      cmdb_artifact: ${{ needs.verified-candidate.outputs.cmdb_artifact }}
      cmdb_sha256: ${{ needs.verified-candidate.outputs.cmdb_sha256 }}
      instance_id: ${{ needs.verified-candidate.outputs.instance_id }}
      gitops_sha: ${{ needs.verified-candidate.outputs.gitops_sha }}
      platform_sha: ${{ needs.verified-candidate.outputs.platform_sha }}
      node_uid: ${{ needs.verified-candidate.outputs.node_uid }}
      cluster_uid: ${{ needs.verified-candidate.outputs.cluster_uid }}
      candidate_sha256: ${{ needs.verified-candidate.outputs.candidate_sha256 }}
  seed-identity-probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions: {contents: read, actions: read, id-token: write}
    uses: ai-workspace-infra/playbooks/.github/workflows/dev-web-saas-seed.yml@87b657dbe68c8d3ee16882e6c3138d59e674d3a6
    with:
      stage: sit
      phase: identity-probe
      candidate_artifact: unused
      candidate_sha256: unused
      cmdb_artifact: unused
      cmdb_sha256: unused
      instance_id: unused
      gitops_sha: unused
      platform_sha: unused
      node_uid: unused
      cluster_uid: unused
      namespace_uid: unused
  identity-allowed:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify dedicated deployment identity and read scope
        run: python3 .github/scripts/feature-lane/vault-probe.py deploy-allowed
  identity-denied-environment:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify missing environment is denied
        run: python3 .github/scripts/feature-lane/vault-probe.py deploy-denied
