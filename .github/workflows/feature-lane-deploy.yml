name: Feature lane protected deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  identity-allowed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify dedicated deployment identity and read scope
        run: python3 .github/scripts/feature-lane/vault-probe.py deploy-allowed
  identity-denied-environment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify missing environment is denied
        run: python3 .github/scripts/feature-lane/vault-probe.py deploy-denied
