name: Environment Data Orchestrator
run-name: 'data:${{ inputs.correlation_id || github.run_id }} / ${{ inputs.mode }} / ${{ inputs.environment }}'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Explicit target environment"
        required: true
        type: "choice"
        options: ["uat","prod"]
        default: "uat"
      mode:
        description: "Single data control plane; imports explicit UAT-only"
        required: true
        type: "choice"
        options: ["preflight","backup","rehearsal","upgrade","rollback","legacy_import","akamai_preflight","checkpoint","probe","baseline","migrate","selfhost_probe","selfhost_init","selfhost_verify","core_users","selfhost_availability"]
        default: "preflight"
      release_tag:
        description: "Immutable release tag"
        type: "string"
        default: ""
      candidate_run_id:
        description: "Accepted UAT Hybrid run"
        type: "string"
        default: ""
      rehearsal_run_id:
        description: "PROD: successful full UAT upgrade/rollback/re-upgrade run"
        type: "string"
        default: ""
      expected_schema_version:
        description: "Exact clean starting version"
        type: "string"
        default: ""
      target_schema_version:
        description: "Exact reviewed target version"
        type: "string"
        default: ""
      migration_sha256:
        description: "Reviewed SQL checksum"
        type: "string"
        default: ""
      accounts_ref:
        description: "Reviewed Accounts source ref"
        type: "string"
        default: "main"
      config_json:
        description: "Non-secret config; core_users action defaults to compare, copy is explicit; availability never writes"
        type: "string"
        default: "{}"
      correlation_id:
        description: "Caller correlation ID"
        type: "string"
        default: ""
  workflow_call:
    inputs:
      environment:
        description: "Explicit target environment"
        required: true
        type: "string"
        default: "uat"
      mode:
        description: "Single data control plane; imports explicit UAT-only"
        required: true
        type: "string"
        default: "preflight"
      release_tag:
        description: "Immutable release tag"
        type: "string"
        default: ""
      candidate_run_id:
        description: "Accepted UAT Hybrid run"
        type: "string"
        default: ""
      rehearsal_run_id:
        description: "PROD: successful full UAT upgrade/rollback/re-upgrade run"
        type: "string"
        default: ""
      expected_schema_version:
        description: "Exact clean starting version"
        type: "string"
        default: ""
      target_schema_version:
        description: "Exact reviewed target version"
        type: "string"
        default: ""
      migration_sha256:
        description: "Reviewed SQL checksum"
        type: "string"
        default: ""
      accounts_ref:
        description: "Reviewed Accounts source ref"
        type: "string"
        default: "main"
      config_json:
        description: "Non-secret config; core_users action defaults to compare, copy is explicit; availability never writes"
        type: "string"
        default: "{}"
      correlation_id:
        description: "Caller correlation ID"
        type: "string"
        default: ""

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: environment-data-operations-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ inputs.environment }}
  OPERATION_MODE: ${{ inputs.mode }}
  UPGRADE_MODE: ${{ inputs.mode }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
  EXPECTED_SCHEMA_VERSION: ${{ inputs.expected_schema_version }}
  TARGET_SCHEMA_VERSION: ${{ inputs.target_schema_version }}
  MIGRATION_SHA256: ${{ inputs.migration_sha256 }}

jobs:
  request_gate:
    name: Validate request and approval before credentials
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      config_json: ${{ steps.gate.outputs.config_json }}
      account: ${{ steps.gate.outputs.account }}
      v5_matrix: ${{ steps.gate.outputs.v5_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: gate
        run: python3 .github/scripts/environment-upgrade/validate_operation.py
        env:
          DATA_CONFIG_JSON: ${{ inputs.config_json }}
          V5_ACCEPTANCE_TRUSTED_VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  legacy_import:
    name: Playbooks / explicit one-time UAT import
    needs: request_gate
    if: ${{ inputs.mode == 'legacy_import' }}
    uses: ai-workspace-infra/playbooks/.github/workflows/uat-data-import.yaml@b82d727808696278613df248e01c29059048be35
    with:
      environment: ${{ inputs.environment }}
      config_json: ${{ needs.request_gate.outputs.config_json }}
      accounts_ref: ${{ inputs.accounts_ref }}
      dry_run: ${{ fromJSON(needs.request_gate.outputs.config_json).dry_run }}
      correlation_id: ${{ inputs.correlation_id || github.run_id }}

  akamai_preflight:
    name: IaC / read-only Akamai inventory
    needs: request_gate
    if: ${{ inputs.mode == 'akamai_preflight' }}
    uses: ./.github/workflows/iac-akamai-state-preflight.yaml
    with:
      environment: ${{ inputs.environment }}
      account: ${{ needs.request_gate.outputs.account }}
      gitops_ref: main
      correlation_id: ${{ inputs.correlation_id || github.run_id }}

  serverless_database:
    needs: request_gate
    if: ${{ contains(fromJSON('["checkpoint","probe","baseline","migrate"]'), inputs.mode) }}
    uses: ai-workspace-infra/playbooks/.github/workflows/serverless-database-operations.yml@5a1f68c6de22010b20771ea7583f892c2c899da3
    with:
      environment: ${{ inputs.environment }}
      operation: ${{ inputs.mode }}
      config_json: ${{ needs.request_gate.outputs.config_json }}
      release_tag: ${{ inputs.release_tag }}
      accounts_ref: ${{ inputs.accounts_ref }}
      correlation_id: ${{ inputs.correlation_id || github.run_id }}

  selfhost_database:
    needs: request_gate
    if: ${{ contains(fromJSON('["selfhost_probe","selfhost_init","selfhost_verify"]'), inputs.mode) }}
    uses: ai-workspace-infra/playbooks/.github/workflows/selfhost-database-operations.yml@7d660cdb4066e2a4cf3fed68bccafea939771e64
    with:
      environment: ${{ inputs.environment }}
      operation: ${{ inputs.mode }}
      config_json: ${{ needs.request_gate.outputs.config_json }}
      release_tag: ${{ inputs.release_tag }}
      accounts_ref: ${{ inputs.accounts_ref }}
      correlation_id: ${{ inputs.correlation_id || github.run_id }}

  selfhost_components:
    name: Playbooks / UAT data component roles (not release acceptance)
    needs: request_gate
    if: ${{ fromJSON(needs.request_gate.outputs.config_json).execution_path == 'selfhost_roles' }}
    uses: ai-workspace-infra/playbooks/.github/workflows/selfhost-data-lifecycle.yml@5a1f68c6de22010b20771ea7583f892c2c899da3
    with:
      environment: ${{ inputs.environment }}
      operation: ${{ inputs.mode }}
      release_tag: ${{ inputs.release_tag }}
      expected_schema_version: ${{ inputs.expected_schema_version }}
      config_json: ${{ needs.request_gate.outputs.config_json }}

  core_users:
    name: Selfhost / availability or four-field DB evidence
    needs: request_gate
    if: ${{ inputs.mode == 'core_users' || inputs.mode == 'selfhost_availability' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dispatch fixed PROD Selfhost owner and accept sanitized evidence
        id: core_users
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_CONFIG_JSON: ${{ needs.request_gate.outputs.config_json }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 .github/scripts/environment-upgrade/dispatch_core_users.py
      - name: Publish core-user evidence only
        uses: actions/upload-artifact@v7
        with:
          name: core-user-sync-${{ steps.core_users.outputs.child_run_id }}
          path: ${{ runner.temp }}/core-user-sync/core-user-sync-receipt.json
          if-no-files-found: error
          retention-days: 30

  release_controller:
    name: Validate accepted release and reviewed execution capability
    needs: request_gate
    if: ${{ contains(fromJSON('["preflight","backup","rehearsal","upgrade","rollback"]'), inputs.mode) && fromJSON(needs.request_gate.outputs.config_json).execution_path != 'selfhost_roles' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve accepted immutable candidate
        run: python3 .github/scripts/environment-upgrade/pipeline.py candidate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Refuse incomplete execution adapters
        run: python3 .github/scripts/environment-upgrade/pipeline.py capabilities
      - name: Run reviewed delegated phases
        run: |
          set -euo pipefail
          python3 .github/scripts/environment-upgrade/pipeline.py phase preflight
          if [[ "$OPERATION_MODE" == "backup" ]]; then
            python3 .github/scripts/environment-upgrade/pipeline.py phase backup
          elif [[ "$OPERATION_MODE" == "upgrade" || "$OPERATION_MODE" == "rehearsal" ]]; then
            for phase in backup migration promotion verification; do
              python3 .github/scripts/environment-upgrade/pipeline.py phase "$phase"
            done
            if [[ "$OPERATION_MODE" == "rehearsal" ]]; then
              for phase in rollback repromotion final_verification; do
                python3 .github/scripts/environment-upgrade/pipeline.py phase "$phase"
              done
              python3 .github/scripts/environment-upgrade/pipeline.py qualify
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish sanitized release evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: environment-data-evidence-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/environment-upgrade/public
          if-no-files-found: warn
          retention-days: 30

  post_migration_v5:
    name: V5 read-only acceptance / ${{ matrix.host }}
    needs: [request_gate, serverless_database, selfhost_database, core_users, release_controller]
    if: >-
      ${{ always() && !cancelled() && needs.request_gate.result == 'success' &&
      fromJSON(needs.request_gate.outputs.config_json).post_migration_v5 != null &&
      (needs.serverless_database.result == 'success' || needs.selfhost_database.result == 'success' ||
      needs.core_users.result == 'success' || needs.release_controller.result == 'success') }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.request_gate.outputs.v5_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact infrastructure artifact and materialize one target
        env:
          GH_TOKEN: ${{ github.token }}
          V5_MODE: materialize
          V5_MATRIX_ROW: ${{ toJSON(matrix) }}
        run: python3 .github/scripts/acceptance/migration_matrix.py
      - name: Checkout immutable Playbooks owner
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ matrix.playbooks_sha }}
          path: playbooks
          persist-credentials: false
      - name: Load environment-scoped SSH identity
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ matrix.vault_addr }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.environment }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/${{ inputs.environment }} SSH_PRIVATE_DEPLOY_KEY_B64 | V5_SSH_KEY_B64
      - name: Execute same SSH Playbook Role and generate readable evidence
        uses: ./playbooks/.github/actions/v5-readonly-acceptance
        with:
          plan: ${{ runner.temp }}/v5-input/plan.json
          cmdb: ${{ runner.temp }}/v5-input/cmdb.json
          evidence-dir: ${{ runner.temp }}/v5-evidence
          ssh-key-b64: ${{ steps.vault.outputs.V5_SSH_KEY_B64 }}
      - name: Archive Markdown JUnit and sanitized evidence even after failed checks
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: v5-report-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v5-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Require exact report identity checksums and all mandatory checks
        if: ${{ always() }}
        env:
          V5_REPORT_DIR: ${{ runner.temp }}/v5-evidence/report
          V5_MATRIX_ROW: ${{ toJSON(matrix) }}
        run: python3 .github/scripts/acceptance/verify_report.py

  verdict:
    name: Selected executor must succeed (dispatch is not acceptance)
    if: ${{ always() && needs.request_gate.result != '' && needs.legacy_import.result != '' && needs.akamai_preflight.result != '' && needs.serverless_database.result != '' && needs.selfhost_database.result != '' && needs.selfhost_components.result != '' && needs.core_users.result != '' && needs.release_controller.result != '' && needs.post_migration_v5.result != '' }}
    needs: [request_gate, legacy_import, akamai_preflight, serverless_database, selfhost_database, selfhost_components, core_users, release_controller, post_migration_v5]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MODE: ${{ inputs.mode }}
          CONFIG_JSON: ${{ needs.request_gate.outputs.config_json || '{}' }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          mode = os.environ["MODE"]
          config = json.loads(os.environ["CONFIG_JSON"])
          target = ("legacy_import" if mode == "legacy_import" else
                    "akamai_preflight" if mode == "akamai_preflight" else
                    "serverless_database" if mode in {"checkpoint","probe","baseline","migrate"} else
                    "selfhost_database" if mode in {"selfhost_probe","selfhost_init","selfhost_verify"} else
                    "core_users" if mode in {"core_users", "selfhost_availability"} else
                    "selfhost_components" if config.get("execution_path") == "selfhost_roles" else
                    "release_controller")
          if any(needs[job]["result"] != "success" for job in ("request_gate", target)):
              raise SystemExit("Selected data operation did not pass; downstream blocked")
          if config.get("post_migration_v5") is not None and needs["post_migration_v5"]["result"] != "success":
              raise SystemExit("V5 matrix missing, failed or skipped; downstream blocked")
          print("Selected executor completed; consult scoped evidence for live acceptance")
          PY
