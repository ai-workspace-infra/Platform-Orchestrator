name: Resolve Daily candidate declaration
description: Parse the pinned GitOps policy, resolve owner SHAs, and allocate one unused UAT candidate ID.
inputs:
  mode: {required: true, description: declaration or resolve}
  gitops-root: {required: true, description: Pinned GitOps checkout}
  artifacts-root: {required: true, description: Pinned Artifacts checkout}
  iac-root: {required: true, description: Pinned IaC checkout}
  playbooks-root: {required: true, description: Pinned Playbooks checkout}
  policy-path: {required: true, description: Policy path relative to the GitOps checkout}
  source-ref: {required: true, description: Selected base source ref}
  delivery-scope: {required: true, description: Selected delivery scope}
  snapshot-tag: {required: false, default: "", description: Optional unused UAT candidate ID}
  deploy-after-build: {required: true, description: Whether an explicit UAT dispatch was requested}
  target-ref: {required: false, default: "", description: Explicit GitOps UAT target identifier}
  github-token: {required: false, default: "", description: Repository-scoped token used only in resolve mode}
outputs:
  component_owner:
    value: ${{ steps.resolve.outputs.component_owner }}
  component_repositories:
    value: ${{ steps.resolve.outputs.component_repositories }}
  candidate_id:
    value: ${{ steps.resolve.outputs.candidate_id }}
  component_matrix:
    value: ${{ steps.resolve.outputs.component_matrix }}
  gitops_sha:
    value: ${{ steps.resolve.outputs.gitops_sha }}
  artifacts_sha:
    value: ${{ steps.resolve.outputs.artifacts_sha }}
  iac_sha:
    value: ${{ steps.resolve.outputs.iac_sha }}
  playbooks_sha:
    value: ${{ steps.resolve.outputs.playbooks_sha }}
  uat_dispatch:
    value: ${{ steps.resolve.outputs.uat_dispatch }}
  uat_owner:
    value: ${{ steps.resolve.outputs.uat_owner }}
  uat_repository:
    value: ${{ steps.resolve.outputs.uat_repository }}
runs:
  using: composite
  steps:
    - name: Select an isolated Python runtime
      id: python
      shell: bash
      run: |
        if python3 -c 'import yaml' 2>/dev/null; then
          echo 'executable=python3' >> "$GITHUB_OUTPUT"
        else
          runtime="$RUNNER_TEMP/daily-candidate-python"
          python3 -m venv "$runtime"
          "$runtime/bin/pip" install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
          echo "executable=$runtime/bin/python" >> "$GITHUB_OUTPUT"
        fi
    - id: resolve
      shell: bash
      env:
        RESOLVE_MODE: ${{ inputs.mode }}
        GITOPS_ROOT: ${{ inputs.gitops-root }}
        ARTIFACTS_ROOT: ${{ inputs.artifacts-root }}
        IAC_ROOT: ${{ inputs.iac-root }}
        PLAYBOOKS_ROOT: ${{ inputs.playbooks-root }}
        CANDIDATE_POLICY_PATH: ${{ inputs.policy-path }}
        SELECTED_SOURCE_REF: ${{ inputs.source-ref }}
        SELECTED_DELIVERY_SCOPE: ${{ inputs.delivery-scope }}
        REQUESTED_SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
        DEPLOY_AFTER_BUILD: ${{ inputs.deploy-after-build }}
        SELECTED_TARGET_REF: ${{ inputs.target-ref }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
      run: ${{ steps.python.outputs.executable }} "$GITHUB_ACTION_PATH/resolve.py"

